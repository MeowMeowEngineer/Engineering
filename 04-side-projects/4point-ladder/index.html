  --chip: #e8ebf0;
  --f-serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {

    --omr: #f06a7e; --omr-soft: #3a1d27; --good: #4cc08a; --good-soft: #15302a; --warn: #e3a64b; --warn-soft: #33281a;

  }
}
:root[data-theme="dark"] {
  --paper: #0f1420; --sheet: #161d2c; --ink: #e5e9f1; --muted: #98a2b5; --line: #29324a;

  --rail: #39435c; --chip: #222b3e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--omr); outline-offset: 2px; }

.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand b { font-family: var(--f-serif); font-weight: 900; font-size: 20px; letter-spacing: -0.02em; }
.brand b span { color: var(--omr); }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 1px solid transparent; border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--muted); cursor: pointer; }
.nav button[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--sheet); font-weight: 600; }

main.wrap { padding-block: 20px 56px; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-serif); font-weight: 900; font-size: clamp(24px, 5.4vw, 32px); line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 60ch; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.small { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--omr); border-color: var(--omr); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: none; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 14px; border-radius: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 14px; justify-self: start; }

.cards { display: grid; grid-template-columns: 1fr; gap: 12px; }

.card:hover { border-color: var(--muted); }
.card .unit { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
.card h3 { font-family: var(--f-serif); font-size: 19px; font-weight: 700; }
.card .next { font-size: 14px; color: var(--muted); }
.card .next b { color: var(--ink); font-weight: 600; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 22px; height: 6px; border-radius: 3px; background: var(--chip); }
.dot.weak { background: var(--omr); }
.dot.slow { background: var(--warn); }
.dot.pass { background: var(--good); opacity: .55; }
.dot.mastered { background: var(--good); }
.dot.goal { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--omr); background: none; }

.paper { background: var(--sheet); border: 1px solid var(--line); border-top: 3px double var(--ink); border-radius: 4px; padding: 18px 18px 20px; font-family: var(--f-serif); font-size: 17px; line-height: 1.95; }
.paper .no { font-weight: 900; margin-right: 6px; }
.paper .pts { font-family: var(--f-ui); font-size: 14px; white-space: nowrap; }
.paper .note { display: block; margin-top: 6px; font-size: 15px; color: var(--muted); }
.paper .hint { display: block; margin-top: 12px; padding: 10px 12px; background: var(--warn-soft); border-radius: 6px; font-family: var(--f-ui); font-size: 15px; }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }

.ladder { position: relative; display: grid; gap: 10px; }

.rung .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--rail); font-family: var(--f-mono); font-weight: 600; font-size: 15px; z-index: 1; }
.rung.mastered .n, .rung.pass .n { border-color: var(--good); color: var(--good); }
.rung.weak .n { border-color: var(--omr); color: var(--omr); }
.rung.slow .n { border-color: var(--warn); color: var(--warn); }
.rung.goal .n { background: var(--omr); border-color: var(--omr); color: #fff; }
.rung .body { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }

.rung .head h3 { font-size: 16px; }
.cue { font-size: 14px; color: var(--muted); }
.cue q { quotes: "“" "”"; color: var(--ink); font-family: var(--f-serif); }
.role { font-size: 15px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip.weak { background: var(--omr-soft); color: var(--omr); }
.chip.slow { background: var(--warn-soft); color: var(--warn); }
.chip.pass { background: var(--good-soft); color: var(--good); }
.chip.mastered { background: var(--good); color: var(--sheet); }

.callout { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.callout.next { border-color: var(--omr); }

.qbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qbar .mode { font-weight: 700; }

details.core div { margin-top: 6px; }
.timer { display: grid; gap: 6px; }

.choice b { font-family: var(--f-ui); color: var(--omr); }
.choice[aria-pressed="true"] { border: 2px solid var(--omr); background: var(--omr-soft); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.pad .ok { grid-column: 1 / -1; background: var(--omr); border-color: var(--omr); color: #fff; font-family: var(--f-ui); font-size: 17px; }
.fb { border-radius: 14px; padding: 16px; display: grid; gap: 10px; border: 1px solid var(--line); background: var(--sheet); }
.fb .verdict { font-weight: 700; font-size: 17px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }

.fb.slow .verdict { color: var(--warn); }
.fb.bad .verdict { color: var(--omr); }
.sol { font-size: 15px; line-height: 1.9; }

.list { display: grid; gap: 8px; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.li .nm { font-weight: 600; }
.li .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.unitgroup { display: grid; gap: 8px; }
.unitgroup h2 { font-size: 15px; color: var(--muted); }
footer.wrap { padding-block: 0 40px; font-size: 13px; color: var(--muted); }

function backTree(r, y, top, depth) {
  const lines = []; let level = [y];
  for (let d = 0; d < depth; d++) {
    const next = [];
    level.forEach(v => {

      lines.push(T`$a_{${top - d}}=${v}$ → $a_{${top - d - 1}}$: ${ps.length ? `$${ps.join(', ')}$` : '없음'}`);

    level = next;
  }
  return { vals: level, lines };
}

      { id: 'tri_area', cue: '넓이가 15√3/4', role: T`$\dfrac12 bc\sin A$로 $\sin A$를 구한다` },
      { id: 't_special', cue: '∠A > π/2', role: T`$\sin A=\dfrac{\sqrt3}{2}$인 두 각 중 둔각 $\dfrac23\pi$를 고르고 $\cos A=-\dfrac12$을 쓴다` },
      { id: 'tri_cos', cue: '두 변 5, 3과 끼인각 A', role: '코사인법칙으로 BC를 구한다' },
      { id: 'tri_sin', cue: '외접원의 넓이', role: T`사인법칙 $\dfrac{a}{\sin A}=2R$로 반지름을 구한다` },
    ],
    steps: [
      { c: 'tri_area', q: T`$\dfrac12\cdot5\cdot3\cdot\sin A=\dfrac{15\sqrt3}{4}$일 때, $4\sin^2 A$의 값을 구하시오.`, a: 3, hint: T`$\sin A=\dfrac{\sqrt3}{2}$입니다.`, sol: T`$\sin A=\dfrac{\sqrt3}{2}$, $4\sin^2A=3$` },
      { c: 't_special', q: T`$${ANG_A}>\dfrac{\pi}{2}$이므로 $A=\dfrac{n}{6}\pi$이다. $n$의 값을 구하시오.`, a: 4, hint: T`$\sin A=\dfrac{\sqrt3}{2}$인 각은 $\dfrac{\pi}{3}$과 $\dfrac23\pi$입니다.`, sol: T`둔각인 $\dfrac23\pi=\dfrac46\pi$, $\cos A=-\dfrac12$` },
      { c: 'tri_cos', q: T`$${BC_T}^{\,2}$의 값을 구하시오.`, a: 49, hint: T`$25+9-2\cdot5\cdot3\cdot\left(-\dfrac12\right)$`, sol: T`$34+15=49$, $${BC_T}=7$` },
      { c: 'tri_sin', q: T`외접원의 반지름을 $R$라 하면 $\dfrac{7}{\sin A}=2R$이다. 외접원의 넓이가 $k\pi$일 때 $3k$의 값을 구하시오.`, a: 49, hint: T`$R=\dfrac{7}{\sqrt3}$, $k=R^2$입니다.`, sol: T`$R^2=\dfrac{49}{3}$, $3k=49$` },
    ],
    twin() {
      let b, c, obt;
      do { b = rnd(2, 8); c = rnd(2, 8); obt = Math.random() < 0.6; } while (b === c || (obt && b === 3 && c === 5));

      return {
        q: T`삼각형 $\mathrm{ABC}$에서 $${AB_T}=${c},\ ${AC_T}=${b}$이고 삼각형 $\mathrm{ABC}$의 넓이는 $${fracSqrt3(b * c, 4)}$이다. $${ANG_A}${obt ? '>' : '<'}\dfrac{\pi}{2}$일 때, 삼각형 $\mathrm{ABC}$의 외접원의 넓이를 $k\pi$라 하자. $3k$의 값을 구하시오.`, a: a2,
        sol: T`$\dfrac12\cdot${b}\cdot${c}\cdot\sin A=${fracSqrt3(b * c, 4)}$에서 $\sin A=\dfrac{\sqrt3}{2}$, ${obt ? '둔각' : '예각'}이므로 $A=${obt ? T`\dfrac23\pi` : T`\dfrac{\pi}{3}`}$<br>$${BC_T}^{\,2}=${b * b}+${c * c}${obt ? '+' : '-'}${b * c}=${a2}$<br>$2R=\dfrac{${BC_T}}{\sin A}$에서 $R^2=\dfrac{${a2}}{3}$, $3k=${a2}$`,
      };

const KEY = 'ladder.v1';
let P = { c: {}, t: {} };
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign({ c: {}, t: {} }, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const cs = id => (P.c[id] ||= { n: 0, ok: 0, streak: 0, mastered: false, best: null });
const ts = id => (P.t[id] ||= { diag: null, steps: false, twinBest: null, origMs: null });
const TG = Object.fromEntries(TARGETS.map(t => [t.id, t]));
// 목표 문제가 아직 없는 과목은 확장 계획만 보여 준다
const SUBJECTS = [
  { id: '수학', what: '문제' },
  { id: '국어', what: '고난도 문항', plan: '문법(음운 변동, 문장 성분)은 수학처럼 단어만 바꾼 반복 문제로 훈련합니다. 독서의 &lt;보기&gt; 적용 문항은 지문 속 단서 문장을 짚고, 문단 핵심 정리 · 인과와 조건 관계 · 지문 개념과 &lt;보기&gt; 사례 대응 같은 읽기 단계로 쪼갭니다.' },
  { id: '영어', what: '고난도 문항', plan: '빈칸 추론 · 글의 순서 · 문장 삽입 문항을 핵심 구문 해석, 연결사와 논리 흐름, 대명사가 가리키는 대상, 주제문 찾기로 쪼갭니다. 구문과 어법은 문장 단위 반복 문제로 훈련합니다.' },
  { id: '탐구', what: '고난도 문항', plan: '화학Ⅰ 양적 관계, 물리학Ⅰ 역학, 생명과학Ⅰ 유전, 사회·문화 도표 분석처럼 계산이 들어가는 문항부터 만듭니다. 수학과 같은 방식으로 숫자를 바꾼 반복 문제와 쌍둥이 문제를 자동으로 만듭니다.' },
];
const CIRCLED = ['①', '②', '③', '④', '⑤'];
const fmtAns = (it, v) => (it.choices ? CIRCLED[v - 1] || v : v);

const STATUS_LABEL = { unknown: '진단 전', weak: '약함', slow: '느림', pass: '통과', mastered: '숙달' };
function cStatus(cid, tid) {
  if (cs(cid).mastered) return 'mastered';
  const d = tid && ts(tid).diag;
  return (d && d[cid]) || 'unknown';
}
const needsWork = st => st === 'weak' || st === 'slow';
const secs = ms => Math.round(ms / 1000);
const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const TWIN_SEC = 300;

function nextAction(tid) {
  const t = TG[tid], s = ts(tid);
  if (!s.diag) return { act: 'diag', label: `개념 진단 ${t.concepts.length}문항`, why: '이 문제에 섞인 개념을 하나씩 따로 풀어 어디서 막히는지 찾습니다.' };
  const weak = t.concepts.find(c => needsWork(cStatus(c.id, tid)));
  if (weak) return { act: 'drill', c: weak.id, label: `훈련: ${CONCEPTS[weak.id].name}`, why: '목표 시간 안에 3문제 연속으로 맞히면 숙달로 바뀝니다.' };
  if (!s.steps) return { act: 'steps', label: '연결 풀이', why: '숙달한 개념을 이 문제 안에서 순서대로 이어 붙입니다.' };
  return { act: 'twin', label: '쌍둥이 문제 실전', why: `숫자만 바꾼 같은 유형을 힌트 없이 ${TWIN_SEC / 60}분 안에 풉니다.` };
}

/* ---------- 화면 ---------- */
const app = document.getElementById('app');
let view = { name: 'home' };
let Q = null;
let timerId = null;

function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  clearInterval(timerId); timerId = null;
  try { window.MathJax?.typesetClear?.([app]); } catch (e) {}
  app.innerHTML = mathSafe(({ home: homeV, target: targetV, quiz: quizV, result: resultV, map: mapV })[view.name]());
  typeset(app);
  if (view.name === 'quiz' && !Q.verdict) startTimer();
  const onMap = view.name === 'map';
  document.getElementById('nav-home')[onMap ? 'removeAttribute' : 'setAttribute']('aria-current', 'page');
  document.getElementById('nav-map')[onMap ? 'setAttribute' : 'removeAttribute']('aria-current', 'page');
}
// 수식 안의 '<' 가 HTML 태그로 읽히지 않게 \lt 로 바꾼다
const mathSafe = html => html.replace(/\$[^$]+\$/g, m => m.replace(/</g, '\\lt '));
function typeset(el) {
  const M = window.MathJax;
  if (M && M.typesetPromise) M.startup.promise.then(() => M.typesetPromise([el])).catch(() => {});
}

function dotsFor(t) {
  const s = ts(t.id);
  return t.concepts.map(c => `<span class="dot ${cStatus(c.id, t.id)}"></span>`).join('') + `<span class="dot goal ${s.twinBest ? 'on' : ''}" title="쌍둥이 실전"></span>`;
}

function homeV() {
  const subj = SUBJECTS.find(x => x.id === (view.subj || '수학'));

    const s = ts(t.id), na = nextAction(t.id);

    return `<button class="card" data-act="target" data-id="${t.id}">

      <span class="eyebrow">수능 고난도 문항 훈련</span>

      <p class="lede">수학 4점 문제 하나에는 개념이 3~5개 섞여 있습니다. 개념마다 짧은 문제로 진단하고, 약한 개념만 목표 시간 안에 풀 때까지 반복한 뒤, 원래 문제와 숫자만 바꾼 쌍둥이 문제로 확인합니다.</p>

}

function paperHTML(no, html, pts) {

}

function targetV() {

/* ---------- 문제 풀이 세션 ---------- */
function newQuiz(o) {
  Q = Object.assign({ idx: 0, log: [], wrongRun: 0, input: '', verdict: null, tries: 0 }, o);
  loadItem();
  go({ name: 'quiz' });
}
function loadItem() {
  if (Q.mode === 'drill') {
    const C = CONCEPTS[Q.cid];
    Q.item = Object.assign(C.gen(), { concept: Q.cid, sec: C.sec });
  } else Q.item = Q.items[Q.idx];
  Q.input = ''; Q.verdict = null; Q.tries = 0; Q.ms = 0; Q.t0 = performance.now();
}
function startDiag(tid) {
  const t = TG[tid];
  newQuiz({ mode: 'diag', tid, items: t.concepts.map(c => Object.assign(CONCEPTS[c.id].gen(), { concept: c.id, sec: CONCEPTS[c.id].sec })) });
}
function startDrill(cid, tid, returnTo) { newQuiz({ mode: 'drill', cid, tid: tid || null, returnTo: returnTo || null }); }
function startSteps(tid) {
  const t = TG[tid];
  newQuiz({ mode: 'steps', tid, items: t.steps.map(s => Object.assign({ sec: 90 }, s, { concept: s.c })) });
}
function startTwin(tid) { newQuiz({ mode: 'twin', tid, items: [Object.assign(TG[tid].twin(), { sec: TWIN_SEC })] }); }
function startOrig(tid) {
  const t = TG[tid];
  newQuiz({ mode: 'orig', tid, items: [{ q: t.problem, a: t.answer, sol: t.solution, passage: t.passage, choices: t.choices, sec: TWIN_SEC }] });
}

function modeLabel() {
  const t = Q.tid && TG[Q.tid];
  switch (Q.mode) {
    case 'diag': return `진단 ${Q.idx + 1}/${Q.items.length} · ${CONCEPTS[Q.item.concept].name}`;
    case 'drill': return `훈련 · ${CONCEPTS[Q.cid].name}`;
    case 'steps': return `연결 풀이 ${Q.idx + 1}/${Q.items.length} · ${CONCEPTS[Q.item.concept].name}`;
    case 'twin': return `쌍둥이 실전 · ${t.title}`;
    case 'orig': return `실전 · ${t.title}`;
  }
}

function quizV() {
  const it = Q.item, C = it.concept && CONCEPTS[it.concept];
  const k = Q.mode === 'drill' ? cs(Q.cid) : null;
  const streak = k ? `<span class="streak" aria-label="연속 ${k.streak}회">연속 ${[0, 1, 2].map(i => `<i class="${i < Math.min(k.streak, 3) ? 'on' : ''}"></i>`).join('')}</span>` : '';
  const core = C && Q.mode !== 'diag' ? `<details class="core" ${Q.mode === 'drill' && cs(Q.cid).n === 0 ? 'open' : ''}><summary>핵심 정리 · ${C.name}</summary><div>${C.card}</div></details>` : '';
  const no = Q.mode === 'twin' || Q.mode === 'orig' ? TG[Q.tid].no : Q.mode === 'drill' ? Q.log.length + (Q.verdict ? 0 : 1) : Q.idx + 1;
  const pts = Q.mode === 'twin' || Q.mode === 'orig' ? TG[Q.tid].pts || 4 : null;
  const hint = Q.tries > 0 && it.hint ? `<span class="hint">힌트: ${it.hint}</span>` : '';
  return `
    <div class="qbar"><span class="mode">${modeLabel()}</span><div class="row">${streak}<button class="btn ghost sm" data-act="exit">그만하기</button></div></div>
    ${core}
    ${paperHTML(no, it.q + (it.passage ? `<span class="passage">${it.passage}</span>` : '') + hint, pts)}
    ${Q.verdict ? feedbackHTML() : answerHTML()}`;
}
function answerHTML() {
  const sec = Q.item.sec, ch = Q.item.choices;
  const timer = `<div class="timer"><div class="t"><span>걸린 시간 <b id="tm">0:00</b></span><span>목표 ${clock(sec)}</span></div><div class="bar" id="tbar"><span></span></div></div>`;
  // 5지선다: 선택지를 누르면 고르고, 확인으로 제출한다
  if (ch) return `${timer}
    <div class="answer">
      <div class="choices" id="abox" role="group" aria-label="선택지">${ch.map((c, i) => `<button class="choice" data-act="key" data-k="${i + 1}" aria-pressed="${Q.input === String(i + 1)}"><b>${CIRCLED[i]}</b><span>${c}</span></button>`).join('')}</div>
      <div class="pad"><button class="ok" data-act="key" data-k="ok">확인</button></div>
    </div>`;
  return `${timer}
    <div class="answer">
      <div class="abox" id="abox"><span class="lab">답</span><span class="val ${Q.input ? '' : 'empty'}" id="aval">${Q.input || '–'}</span></div>
      <div class="pad" role="group" aria-label="답 입력">
        ${['1', '2', '3', '4', '5', '6', '7', '8', '9', '−', '0', '⌫'].map(k => `<button data-act="key" data-k="${k}" aria-label="${k === '⌫' ? '지우기' : k === '−' ? '음수 부호' : k}">${k}</button>`).join('')}
        <button class="ok" data-act="key" data-k="ok">확인</button>
      </div>
    </div>`;
}
function feedbackHTML() {
  const it = Q.item, s = secs(Q.ms), v = Q.verdict;
  const head = v === 'ok' ? '정답' : v === 'slow' ? '정답 · 목표 시간 초과' : `오답 · 정답은 ${fmtAns(it, it.a)}`;
  const yours = v === 'bad' ? ` <span class="small">입력한 답 ${fmtAns(it, +Q.input)}</span>` : '';
  let extra = '';
  if (Q.mode === 'drill') {
    const k = cs(Q.cid);
    if (v === 'slow') extra = `<p class="small">맞혔지만 목표 ${clock(it.sec)}보다 느려서 연속 기록은 그대로입니다.</p>`;
    const pre = CONCEPTS[Q.cid].prereq.find(p => !cs(p).mastered);
    if (Q.wrongRun >= 2 && pre) extra += `<div class="callout"><p>두 번 연속 틀렸습니다. 이 개념 아래에 있는 <b>${CONCEPTS[pre].name}</b>부터 다지고 돌아오면 빨라집니다.</p><div class="row"><button class="btn sm" data-act="prereq" data-c="${pre}">${CONCEPTS[pre].name} 먼저 훈련</button></div></div>`;
    if (k.mastered && Q.justMastered) extra += `<p><b>숙달!</b> 목표 시간 안에 3문제 연속으로 맞혔습니다.</p>`;
  }
  const label = Q.mode === 'drill' ? (Q.justMastered ? '결과 보기' : '다음 문제') : (Q.mode === 'twin' || Q.mode === 'orig' || Q.idx + 1 >= Q.items.length) ? '결과 보기' : '다음';
  return `<div class="fb ${v}">
    <div class="verdict">${head}<span class="small mono">${clock(s)} / 목표 ${clock(it.sec)}</span>${yours}</div>
    ${extra}
    <details class="sol" ${v === 'bad' || Q.mode === 'steps' ? 'open' : ''}><summary>풀이</summary><div>${it.sol}</div></details>
    <div class="row"><button class="btn primary" data-act="next" id="nextbtn">${label}</button></div>
  </div>`;
}

function startTimer() {
  const tm = document.getElementById('tm'), bar = document.getElementById('tbar');
  if (!tm) return;
  const tick = () => {
    const el = performance.now() - Q.t0, s = Math.floor(el / 1000), lim = Q.item.sec * 1000;
    tm.textContent = clock(s);
    bar.firstElementChild.style.width = Math.min(100, (el / lim) * 100) + '%';
    bar.classList.toggle('over', el > lim);
  };
  tick(); timerId = setInterval(tick, 250);
}

function press(k) {
  if (!Q || Q.verdict) return;
  if (k === 'ok') return submit();
  const ch = Q.item.choices;
  if (ch) {
    if (/^\d$/.test(k) && +k >= 1 && +k <= ch.length) Q.input = k;
    else if (k === '⌫') Q.input = '';
    document.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === Q.input)));
    return;
  }
  if (k === '⌫') Q.input = Q.input.slice(0, -1);
  else if (k === '−' || k === '-') Q.input = Q.input.startsWith('-') ? Q.input.slice(1) : '-' + Q.input;
  else if (/^\d$/.test(k) && Q.input.replace('-', '').length < 5) Q.input = (Q.input === '0' ? '' : Q.input === '-0' ? '-' : Q.input) + k;
  const v = document.getElementById('aval');
  if (v) { v.textContent = Q.input || '–'; v.classList.toggle('empty', !Q.input); }
}
function shake() {
  const b = document.getElementById('abox');
  if (b) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
}
function submit() {
  if (!Q.input || Q.input === '-') return shake();
  const val = parseInt(Q.input, 10), it = Q.item, ms = performance.now() - Q.t0, right = val === it.a;
  if (!right && Q.mode === 'steps' && Q.tries === 0) {
    Q.tries = 1; Q.input = '';
    const t0 = Q.t0; render(); Q.t0 = t0; shake();
    return;
  }
  Q.ms = ms;
  Q.verdict = right ? (ms <= it.sec * 1000 ? 'ok' : 'slow') : 'bad';
  Q.justMastered = false;
  if (it.concept && (Q.mode === 'diag' || Q.mode === 'drill')) {
    const k = cs(it.concept);
    k.n++; if (right) { k.ok++; k.best = k.best ? Math.min(k.best, ms) : ms; }
    if (Q.mode === 'drill') {
      if (Q.verdict === 'ok') k.streak++; else if (Q.verdict === 'bad') k.streak = 0;
      Q.wrongRun = Q.verdict === 'bad' ? Q.wrongRun + 1 : 0;
      if (k.streak >= 3 && !k.mastered) { k.mastered = true; Q.justMastered = true; }
    }
  }
  if (Q.mode === 'twin' && right) { const s = ts(Q.tid); s.twinBest = s.twinBest ? Math.min(s.twinBest, ms) : ms; }
  if (Q.mode === 'orig' && right) { const s = ts(Q.tid); s.origMs = s.origMs ? Math.min(s.origMs, ms) : ms; }
  Q.log.push({ concept: it.concept, verdict: Q.verdict, ms });
  save(); render();
}
function next() {
  if (Q.mode === 'drill') {
    if (Q.justMastered) return go({ name: 'result' });
    loadItem(); return render();
  }
  if (Q.mode === 'twin' || Q.mode === 'orig') return go({ name: 'result' });
  Q.idx++;
  if (Q.idx < Q.items.length) { loadItem(); return render(); }
  if (Q.mode === 'diag') {
    const d = {};
    Q.log.forEach(l => { d[l.concept] = l.verdict === 'ok' ? 'pass' : l.verdict === 'slow' ? 'slow' : 'weak'; });
    ts(Q.tid).diag = d;
  }
  if (Q.mode === 'steps') ts(Q.tid).steps = true;
  save(); go({ name: 'result' });
}
function exitQuiz() {
  if (Q && Q.mode === 'drill' && Q.log.length) return go({ name: 'result' });
  go(Q && Q.tid ? { name: 'target', id: Q.tid } : { name: 'map' });
}

function resultV() {
  const t = Q.tid && TG[Q.tid];
  const back = t ? `<button class="btn" data-act="target" data-id="${t.id}">개념 사다리로</button>` : `<button class="btn" data-act="map">개념 지도로</button>`;
  const na = t ? nextAction(t.id) : null;
  const nextBtn = na ? `<button class="btn primary" data-act="${na.act}" data-id="${t.id}" data-t="${t.id}" ${na.c ? `data-c="${na.c}"` : ''}>${na.label}</button>` : '';
  if (Q.mode === 'diag') {
    const rows = Q.log.map(l => {
      const st = l.verdict === 'ok' ? 'pass' : l.verdict === 'slow' ? 'slow' : 'weak', C = CONCEPTS[l.concept];
      return `<div class="li"><span class="nm">${C.name}</span><span class="chip ${st}">${STATUS_LABEL[st]}</span><span class="meta mono">${clock(secs(l.ms))} / 목표 ${clock(C.sec)}</span></div>`;
    }).join('');
    const weak = Q.log.filter(l => l.verdict !== 'ok').length;
    return `<span class="eyebrow">진단 결과 · ${t.title}</span>
      <h1>${weak ? `개념 ${weak}개를 다지면 이 문제에 도달합니다` : '네 개념 모두 통과했습니다'}</h1>
      <p class="lede">${weak ? '틀린 개념은 약함, 맞혔지만 목표 시간을 넘긴 개념은 느림으로 표시했습니다. 표시된 개념만 훈련합니다.' : '개념은 갖춰져 있으니 문제 안에서 이어 붙이는 연습으로 넘어갑니다.'}</p>
      <div class="list">${rows}</div>
      <div class="row">${nextBtn}${back}</div>`;
  }
  if (Q.mode === 'drill') {
    const C = CONCEPTS[Q.cid], k = cs(Q.cid), n = Q.log.length, ok = Q.log.filter(l => l.verdict !== 'bad').length;
    const avg = n ? clock(secs(Q.log.reduce((s, l) => s + l.ms, 0) / n)) : '–';
    const ret = Q.returnTo ? `<button class="btn primary" data-act="drill" data-c="${Q.returnTo}" data-t="${Q.tid || ''}">${CONCEPTS[Q.returnTo].name}(으)로 돌아가기</button>` : '';
    return `<span class="eyebrow">훈련 결과</span>
      <h1>${k.mastered ? `${C.name} 숙달` : `${C.name} 연습 중`}</h1>
      <p class="lede">${n}문제 중 ${ok}문제 정답, 평균 ${avg}. ${k.mastered ? '목표 시간 안에 3문제 연속으로 맞혔습니다.' : `숙달까지 목표 시간 안 연속 정답 ${3 - Math.min(k.streak, 3)}개가 더 필요합니다.`}</p>
      <div class="row">${ret || (k.mastered ? nextBtn : `<button class="btn primary" data-act="drill" data-c="${Q.cid}" data-t="${Q.tid || ''}">이어서 훈련</button>`)}${back}</div>`;
  }
  if (Q.mode === 'steps') {
    return `<span class="eyebrow">연결 풀이 완료 · ${t.title}</span>
      <h1>개념 ${t.concepts.length}개를 한 문제로 이었습니다</h1>
      <div class="callout"><span class="eyebrow">전체 풀이</span><div class="sol">${t.solution}</div></div>
      <p class="lede">이제 숫자만 바꾼 쌍둥이 문제를 힌트 없이 ${TWIN_SEC / 60}분 안에 풀어 봅니다.</p>
      <div class="row"><button class="btn primary" data-act="twin" data-id="${t.id}">쌍둥이 문제 실전</button>${back}</div>`;
  }
  const l = Q.log[0], s = secs(l.ms), right = l.verdict !== 'bad';
  if (Q.mode === 'orig') {
    return `<span class="eyebrow">실전 결과 · ${t.title}</span>
      <h1>${right ? `${clock(s)} 만에 맞혔습니다` : '이 문제는 개념으로 쪼개서 갑니다'}</h1>
      <p class="lede">${right ? '숫자를 바꾼 쌍둥이 문제로 같은 풀이가 통하는지 확인해 보세요.' : `이 문제에는 개념 ${t.concepts.length}개가 섞여 있습니다. 진단으로 어느 개념에서 막혔는지부터 찾습니다.`}</p>
      <div class="row">${right ? `<button class="btn primary" data-act="twin" data-id="${t.id}">쌍둥이 문제 풀기</button>` : nextBtn}${back}</div>`;
  }
  const best = ts(t.id).twinBest;
  return `<span class="eyebrow">쌍둥이 실전 결과 · ${t.title}</span>
    <h1>${right ? (l.verdict === 'ok' ? `도달! ${clock(s)}` : `정답, 하지만 ${clock(s)}`) : '한 번 더 오르면 됩니다'}</h1>
    <p class="lede">${right ? (l.verdict === 'ok' ? `목표 ${TWIN_SEC / 60}분 안에 힌트 없이 풀었습니다.${best ? ` 최고 기록 ${clock(secs(best))}.` : ''}` : '맞혔지만 목표 시간을 넘겼습니다. 다른 쌍둥이 문제로 속도를 올려 보세요.') : '틀린 단계의 개념을 다시 훈련하거나, 연결 풀이를 한 번 더 따라가 보세요.'}</p>
    <div class="callout"><span class="eyebrow">풀이</span><div class="sol">${l && Q.item.sol}</div></div>
    <div class="row"><button class="btn primary" data-act="twin" data-id="${t.id}">다른 쌍둥이 문제</button>${right ? '' : `<button class="btn" data-act="steps" data-id="${t.id}">연결 풀이 다시</button>`}${back}</div>`;
}

function mapV() {
  const units = {};
  for (const [id, C] of Object.entries(CONCEPTS)) (units[C.unit] ||= []).push(id);
  const usedIn = id => TARGETS.filter(t => t.concepts.some(c => c.id === id) || t.steps.some(s => s.c === id)).map(t => t.title);
  const groups = Object.entries(units).map(([u, ids]) => `<div class="unitgroup"><h2>${u}</h2>${ids.map(id => {
    const C = CONCEPTS[id], k = cs(id), st = k.mastered ? 'mastered' : k.n ? (k.ok / k.n >= 0.7 ? 'pass' : 'weak') : 'unknown';
    const label = k.mastered ? '숙달' : k.n ? `정답 ${k.ok}/${k.n}` : '아직 안 풀어 봄';
    const used = usedIn(id), pre = C.prereq.map(p => CONCEPTS[p].name);
    return `<div class="li"><span class="nm">${C.name}</span><button class="btn sm" data-act="drill" data-c="${id}">훈련</button>
      <span class="meta"><span class="chip ${st}">${label}</span> ${k.best ? `최고 ${clock(secs(k.best))} · ` : ''}목표 ${clock(C.sec)}${pre.length ? ` · 아래 개념: ${pre.join(', ')}` : ''}${used.length ? ` · 쓰이는 문제: ${used.join(', ')}` : ''}</span></div>`;
  }).join('')}</div>`).join('');
  return `<span class="eyebrow">개념 지도</span>
    <h1>개념 ${Object.keys(CONCEPTS).length}개</h1>
    <p class="lede">목표 문제와 상관없이 개념 하나만 골라 훈련할 수도 있습니다. 문제는 매번 숫자를 바꿔 새로 만듭니다. '아래 개념'은 그 개념이 막힐 때 먼저 다질 개념입니다.</p>
    ${groups}`;
}

/* ---------- 입력 ---------- */
const ACT = {
  home: () => go({ name: 'home', subj: view.subj || (view.id && TG[view.id] && TG[view.id].subject) }),
  subj: d => go({ name: 'home', subj: d.s }),
  map: () => go({ name: 'map' }),
  target: d => go({ name: 'target', id: d.id }),
  diag: d => startDiag(d.id || d.t),
  drill: d => startDrill(d.c, d.t || (view.name === 'target' ? view.id : null)),
  steps: d => startSteps(d.id || d.t),
  twin: d => startTwin(d.id || d.t),
  orig: d => startOrig(d.id),
  key: d => press(d.k),
  next: () => next(),
  exit: () => exitQuiz(),
  prereq: d => startDrill(d.c, Q.tid, Q.cid),
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) ACT[b.dataset.act]?.(b.dataset);
});
document.addEventListener('keydown', e => {
  if (view.name !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (Q.verdict) { if (e.key === 'Enter') { e.preventDefault(); next(); } return; }
  if (/^\d$/.test(e.key) || e.key === '-') press(e.key);
  else if (e.key === 'Backspace') press('⌫');
  else if (e.key === 'Enter') { e.preventDefault(); press('ok'); }
});

render();
</script>
