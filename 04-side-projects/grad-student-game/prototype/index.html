<title>대학원생 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 연구노트 모눈종이 위에 왼쪽은 탭하는 캐릭터, 오른쪽은 고용·상점·전직 탭. 폰에서는 한 줄로 쌓는다. */
:root {
  --paper: #f3f6f9; --grid: #dbe5ee; --card: #ffffff; --line: #c8d4e0;
  --ink: #1b2838; --muted: #5a6879; --accent: #2346a3; --accent-ink: #ffffff;
  --stamp: #c3303a; --good: #2b7a4b; --gold: #a86a00; --soft: #e7eef8; --scrim: rgba(10, 16, 28, 0.55);
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Nanum Pen Script", "Apple SD Gothic Neo", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1828; --grid: #19283d; --card: #142238; --line: #2a3f5c;
  --ink: #e5edf7; --muted: #93a4b9; --accent: #8eaeff; --accent-ink: #0e1828;
  --stamp: #ff6d75; --good: #6fd39a; --gold: #f0b552; --soft: #1b2d48; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0e1828; --grid: #19283d; --card: #142238; --line: #2a3f5c;
  --ink: #e5edf7; --muted: #93a4b9; --accent: #8eaeff; --accent-ink: #0e1828;
  --stamp: #ff6d75; --good: #6fd39a; --gold: #f0b552; --soft: #1b2d48; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 상단 */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: 0.02em; margin: 0; }
.brand small { font-family: var(--font-hand); font-size: 1.25rem; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.topright { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: baseline; gap: 8px; border: 2px solid var(--ink); padding: 2px 10px; background: var(--card); }
.badge b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.badge span { font-family: var(--font-hand); font-size: 1.2rem; color: var(--muted); }
.coupon { border: 2px solid var(--gold); color: var(--gold); background: var(--card); padding: 2px 10px; cursor: pointer; font-weight: 600; }

.main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .main { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); align-items: start; } .left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.left, .right { display: grid; gap: 12px; min-width: 0; }
.sheet { background: var(--card); border: 1px solid var(--line); padding: 14px; min-width: 0; }

/* 데이터·레벨 */
.meter { display: grid; gap: 4px; }
.meter .label { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); }
.meter .big { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 2.6rem); line-height: 1.1; }
.rates { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 0.9rem; }
.rates b { color: var(--ink); font-weight: 600; }
.level { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.level b { font-family: var(--font-display); font-weight: 400; color: var(--ink); font-size: 1rem; }
.bar { height: 8px; background: var(--soft); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--good); width: 0; transition: width 200ms; }

/* 탭 영역 */
.lab { position: relative; overflow: hidden; height: 300px; border: 1px solid var(--line); background: var(--soft); }
.tapper { position: absolute; inset: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.tapper svg { width: 200px; height: 220px; transition: transform 70ms ease-out; }
.tapper.hit svg { transform: scale(0.94, 1.04); }
.hint { position: absolute; left: 10px; bottom: 6px; font-family: var(--font-hand); font-size: 1.25rem; color: var(--muted); pointer-events: none; }
.float { position: absolute; pointer-events: none; font-family: var(--font-display); font-size: 1.1rem; color: var(--accent); animation: up 900ms ease-out forwards; white-space: nowrap; }
.float.lvup { color: var(--good); font-size: 1.4rem; }
.float.pet { color: var(--gold); font-size: 0.95rem; }
@keyframes up { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -70px); opacity: 0; } }
.prof { position: absolute; top: 18px; left: -70px; border: 2px dashed var(--stamp); background: var(--card); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.9rem; animation: fly 12s linear forwards; z-index: 2; }
.prof em { font-style: normal; font-size: 1.4rem; vertical-align: middle; }
@keyframes fly { 0% { left: -120px; top: 18px; } 50% { top: 60px; } 100% { left: calc(100% + 20px); top: 24px; } }
.buffs { position: absolute; right: 8px; top: 8px; display: grid; gap: 4px; justify-items: end; pointer-events: none; }
.chip { background: var(--accent); color: var(--accent-ink); font-size: 0.78rem; padding: 2px 8px; font-weight: 600; }
.tapper .cat { position: absolute; right: 14px; bottom: 8px; width: 64px; height: 56px; pointer-events: none; transform: none; }
.cat .paw { transform-origin: 20px 42px; animation: paw 333ms ease-in-out infinite; }
@keyframes paw { 50% { transform: rotate(-24deg); } }

.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 2px solid var(--ink); background: var(--card); padding: 8px 10px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .t { font-weight: 600; }
.btn .s { font-size: 0.8rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary .s { color: inherit; opacity: 0.85; }
.btn.center { text-align: center; }

/* 논문·전직 */
.paper { display: grid; gap: 10px; }
.next { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; color: var(--muted); flex-wrap: wrap; }
.stampbtn { border: 3px double var(--stamp); color: var(--stamp); background: var(--card); font-family: var(--font-display); font-size: 1.3rem; padding: 8px; cursor: pointer; transform: rotate(-2deg); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: rotate(-2deg) scale(1.04); } }
.autos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { border: 2px solid var(--line); background: var(--card); padding: 6px 10px; cursor: pointer; text-align: left; display: grid; gap: 0; }
.toggle .t { font-weight: 600; font-size: 0.9rem; }
.toggle .s { font-size: 0.75rem; color: var(--muted); }
.toggle[aria-pressed="true"] { border-color: var(--good); }
.toggle[aria-pressed="true"] .t::after { content: " ON"; color: var(--good); }
.toggle:disabled { opacity: 0.45; cursor: not-allowed; }

/* 탭 메뉴 */
.tabs { display: flex; border-bottom: 2px solid var(--ink); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 10px 12px; }
.row .name { font-weight: 600; }
.row .name .own { font-family: var(--font-display); font-weight: 400; color: var(--accent); margin-left: 6px; }
.row .note { font-family: var(--font-hand); font-size: 1.15rem; color: var(--muted); line-height: 1.2; }
.row .meta { font-size: 0.82rem; color: var(--muted); }
.row.locked { opacity: 0.5; }
.buy { border: 2px solid var(--ink); background: var(--card); padding: 6px 10px; cursor: pointer; min-width: 92px; text-align: right; }
.buy:not(:disabled):hover { background: var(--soft); }
.buy:disabled { opacity: 0.4; cursor: not-allowed; }
.buy b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.buy small { color: var(--muted); font-size: 0.75rem; }
.buy.gold { border-color: var(--gold); }
.h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; margin: 8px 0 0; }
.notice { border: 2px dashed var(--gold); padding: 8px 12px; font-size: 0.88rem; background: var(--card); }

.tree { display: grid; gap: 6px; }
.tier { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); }
.tier .n { font-family: var(--font-display); font-size: 1.2rem; color: var(--muted); }
.tier.done .n { color: var(--good); }
.tier.now { border: 2px solid var(--accent); }
.tier .meta { font-size: 0.82rem; color: var(--muted); }

.colhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.colhead b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.colmeta { font-size: 0.82rem; color: var(--muted); }
.colmeta .done { color: var(--good); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 8px; }
.item { border: 1px solid var(--line); padding: 6px 8px; font-size: 0.85rem; background: var(--card); display: grid; gap: 2px; min-width: 0; }
.item .rar { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; }
.item .rar.c { color: var(--muted); } .item .rar.r { color: var(--accent); } .item .rar.l { color: var(--gold); }
.item.l.owned { border: 2px solid var(--gold); }
.item.missing { background: var(--soft); color: var(--muted); }
.item .q { font-family: var(--font-hand); font-size: 1.15rem; line-height: 1.15; }
.item svg { width: 54px; height: 60px; }
.stars { color: var(--gold); letter-spacing: 2px; }
.toast { position: absolute; left: 8px; right: 8px; top: 8px; background: var(--card); border: 2px solid var(--gold); padding: 6px 10px; font-size: 0.85rem; font-weight: 600; z-index: 3; pointer-events: none; animation: toast 2.8s ease-out forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.log { display: grid; gap: 4px; font-size: 0.9rem; max-height: 260px; overflow-y: auto; }
.log ol { margin: 0; padding: 0; }
.log li { list-style: none; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.ticker { font-family: var(--font-hand); font-size: 1.3rem; line-height: 1.3; min-height: 1.6em; }

/* 모달 */
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--card); border: 2px solid var(--ink); max-width: 420px; width: 100%; max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; display: grid; gap: 12px; text-align: center; }
.dialog h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; margin: 0; text-wrap: balance; }
.dialog p { margin: 0; }
.dialog .hand { font-family: var(--font-hand); font-size: 1.4rem; color: var(--muted); }
.dialog svg { width: 150px; height: 165px; justify-self: center; }
.adbox { border: 2px solid var(--line); background: var(--soft); height: 140px; display: grid; place-items: center; font-family: var(--font-display); font-size: 3rem; color: var(--muted); }
.bigstamp { justify-self: center; border: 4px double var(--stamp); color: var(--stamp); font-family: var(--font-display); font-size: 1.6rem; padding: 2px 16px; transform: rotate(-8deg); animation: stamp 420ms cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; text-align: left; font-size: 0.92rem; }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.danger { border-color: var(--stamp); color: var(--stamp); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } .prof { animation: none; left: 12px; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">대학원생 키우기 <small>석사 입학부터 살아있는 교과서까지</small></h1>
    <div class="topright">
      <button class="coupon num" id="couponBtn" aria-label="커피 쿠폰, 상점 열기">☕ <span id="coupons">0</span></button>
      <div class="badge"><b id="tierName">석사과정</b><span id="tierTitle">랩실 막내</span></div>
    </div>
  </header>

  <div class="main">
    <section class="left" aria-label="연구실">
      <div class="sheet meter">
        <span class="label">연구 데이터</span>
        <span class="big num" id="data">0</span>
        <div class="rates num"><span>초당 <b id="ps">0</b></span><span>탭당 <b id="pt">1</b></span><span>논문 <b id="papers">0</b>편</span></div>
        <div class="level num"><b id="lv">Lv 0</b><span class="bar" aria-hidden="true"><i id="expBar"></i></span><span id="lvBonus"></span></div>
      </div>
      <div class="lab" id="lab">
        <button class="tapper" id="tapper" aria-label="연구하기 (탭)"></button>
        <div class="buffs" id="buffs"></div>
        <span class="hint" id="hint">대학원생을 탭해서 데이터를 모으세요</span>
      </div>
      <div class="skills" id="skills"></div>
      <div class="sheet ticker" id="ticker" aria-live="polite">연구실에 첫 출근했다. 책상에는 VNA 매뉴얼이 놓여 있다.</div>
    </section>

    <section class="right" aria-label="성장">
      <div class="sheet paper">
        <button class="btn primary" id="writeBtn"><span class="t">논문 쓰기</span><span class="s num" id="writeCost">비용</span></button>
        <div class="next"><span id="nextLabel">다음 전직</span><span class="num" id="nextCount"></span></div>
        <div class="bar" aria-hidden="true"><i id="nextBar" style="background: var(--accent)"></i></div>
        <div class="autos" id="autos"></div>
        <button class="btn" id="centuryBtn" hidden><span class="t">세기의 연구 완성하기</span><span class="s num" id="centuryCost"></span></button>
        <button class="stampbtn" id="promoteBtn" hidden>전직하기</button>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tab-gens" aria-selected="true" data-tab="gens">동료·장비</button>
        <button role="tab" id="tab-tap" aria-selected="false" data-tab="tap">탭 강화</button>
        <button role="tab" id="tab-col" aria-selected="false" data-tab="col">도감</button>
        <button role="tab" id="tab-shop" aria-selected="false" data-tab="shop">상점</button>
        <button role="tab" id="tab-tree" aria-selected="false" data-tab="tree">전직 트리</button>
        <button role="tab" id="tab-rec" aria-selected="false" data-tab="rec">기록</button>
      </nav>
      <div id="panel-gens" class="list"></div>
      <div id="panel-tap" class="list" hidden></div>
      <div id="panel-col" class="list" hidden></div>
      <div id="panel-shop" class="list" hidden></div>
      <div id="panel-tree" class="tree" hidden></div>
      <div id="panel-rec" class="list" hidden></div>
    </section>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

<script src="engine.js"></script>
<script>
(function () {
  const E = window.GradEngine;
  const fmt = E.fmt;
  const KEY = 'gradclicker.v1';
  const $ = (id) => document.getElementById(id);
  const won = (n) => '₩' + n.toLocaleString('ko-KR');
  let st, lastFrame = performance.now(), nextProfAt = 0, hiddenAt = 0, tab = 'gens', petClock = 0;
  const tapTimes = [];
  const MAX_TPS = 15; // 오토클리커 방지: 1초에 15번까지만 인정

  // ---------- 날짜 ----------
  const dayKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => dayKey(new Date());
  const shiftDay = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dayKey(d); };
  const refreshDay = () => E.refreshDay(st, today(), shiftDay(-1));

  // ---------- 캐릭터 (직급마다 머리·옷이 바뀐다) ----------
  const HAIR = { dark: '#2a2a33', grey: '#8e949c', white: '#eceef2' };
  const LOOK = [null,
    { hair: 'neat', outfit: 'hoodie', glasses: false, tired: false },
    { hair: 'messy', outfit: 'hoodie2', glasses: true, tired: true },
    { hair: 'shaggy', outfit: 'check', glasses: true, tired: true },
    { hair: 'messy', outfit: 'cardigan', glasses: true, tired: true },
    { hair: 'part', outfit: 'suit1', glasses: true, tired: false },
    { hair: 'partGrey', outfit: 'suit2', glasses: true, tired: false },
    { hair: 'grey', outfit: 'suit3', glasses: true, tired: false },
    { hair: 'white', outfit: 'gown', glasses: true, tired: false },
    { hair: 'sage', outfit: 'robe', glasses: true, tired: false, beard: true },
  ];
  function hair(kind) {
    const cap = (c) => '<path d="M52 98 Q52 50 100 47 Q148 50 148 98 Q138 72 100 70 Q62 72 52 98 Z" fill="' + c + '"/>';
    const spikes = '<path d="M64 62 L58 40 L78 56 L84 34 L98 54 L110 32 L116 54 L134 38 L132 62 Z" fill="' + HAIR.dark + '"/>';
    switch (kind) {
      case 'neat': return cap(HAIR.dark);
      case 'messy': return cap(HAIR.dark) + spikes;
      case 'shaggy': return cap(HAIR.dark) + spikes + '<path d="M50 98 Q46 120 54 130 L58 100 Z M150 98 Q154 120 146 130 L142 100 Z" fill="' + HAIR.dark + '"/>';
      case 'part': return cap(HAIR.dark) + '<path d="M112 50 Q120 62 146 80" stroke="#55555f" stroke-width="2" fill="none"/>';
      case 'partGrey': return cap(HAIR.dark) + '<path d="M58 84 Q62 60 84 52 Q72 66 66 86 Z" fill="' + HAIR.grey + '"/>';
      case 'grey': return cap(HAIR.grey);
      case 'white': return '<ellipse cx="54" cy="92" rx="10" ry="18" fill="' + HAIR.white + '"/><ellipse cx="146" cy="92" rx="10" ry="18" fill="' + HAIR.white + '"/><path d="M70 60 Q100 50 130 60" stroke="' + HAIR.white + '" stroke-width="6" fill="none" stroke-linecap="round"/>';
      default: {
        // 살아있는 교과서: 옆머리만 남은 흰 머리에 황금 월계관
        let leaves = '';
        for (let i = 0; i <= 12; i++) {
          const a = Math.PI * (1.08 + 0.84 * i / 12), x = 100 + 50 * Math.cos(a), y = 98 + 50 * Math.sin(a);
          leaves += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="8" ry="3.6" transform="rotate(' + ((a * 180) / Math.PI + 90 + (i % 2 ? 28 : -28)).toFixed(0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')" fill="#d4a72c" stroke="#9c7a17" stroke-width="1"/>';
        }
        return '<ellipse cx="54" cy="96" rx="9" ry="16" fill="' + HAIR.white + '"/><ellipse cx="146" cy="96" rx="9" ry="16" fill="' + HAIR.white + '"/>' + leaves;
      }
    }
  }
  function outfit(kind) {
    const body = (c) => '<path d="M34 222 Q36 162 100 156 Q164 162 166 222 Z" fill="' + c + '"/>';
    const suit = (c, tie) => body(c) + '<path d="M84 158 L100 200 L116 158 Z" fill="#f4f6fa"/>' + (tie ? '<path d="M96 168 L104 168 L106 198 L100 206 L94 198 Z" fill="' + tie + '"/>' : '') + '<path d="M84 158 L96 196 L72 176 Z M116 158 L104 196 L128 176 Z" fill="' + c + '" stroke="#00000033"/>';
    switch (kind) {

  // ---------- 저장 ----------
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ st, at: Date.now() })); } catch (e) {} }
  function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }

  // ---------- 모달 (차례로 띄운다) ----------
  const modalQueue = [];
  function openModal(html, buttons) { modalQueue.push({ html, buttons }); if ($('modal').hidden) showNextModal(); }
  function showNextModal() {
    const m = modalQueue.shift();
    if (!m) { $('modal').hidden = true; return; }
    $('dialog').innerHTML = m.html;
    m.buttons.forEach((b) => {
      const el = document.createElement('button');
      el.className = 'btn center ' + (b.primary ? 'primary' : '') + (b.danger ? ' danger' : '');
      el.innerHTML = '<span class="t">' + b.label + '</span>';
      if (b.disabled) el.disabled = true;
      el.addEventListener('click', () => { if (b.keep) { b.fn && b.fn(el); return; } showNextModal(); if (b.fn) b.fn(); });
      $('dialog').appendChild(el);
    });
    $('modal').hidden = false;
    const first = $('dialog').querySelector('button:not(:disabled)'); if (first) first.focus();
  }

  // 광고 시뮬레이션: 5초 카운트다운 뒤 보상. 광고 제거를 샀으면 바로 보상.
  function watchAd(kind, payload, onDone) {
    if (E.adLeft(st, kind) <= 0) { say('오늘 볼 수 있는 광고를 다 봤다. 내일 다시 열린다.'); return; }
    if (st.shop.noAds) { if (E.adReward(st, kind, payload)) { onDone && onDone(); update(); save(); } return; }
    let left = 5, timer;
    modalQueue.unshift({ html: '<p class="hand">광고 (시뮬레이션)</p><div class="adbox num" id="adCount">5</div><p>실제 광고는 나오지 않습니다. 정식 버전에서는 이 자리에 30초 이하 보상형 광고가 나옵니다.</p>',
      buttons: [{ label: '건너뛰기 (보상 없음)', fn: () => clearInterval(timer) }] });
    showNextModal();
    timer = setInterval(() => {
      left--; const el = $('adCount'); if (el) el.textContent = left;
      if (left <= 0) { clearInterval(timer); if (E.adReward(st, kind, payload)) { onDone && onDone(); save(); } showNextModal(); update(); }
    }, 1000);
  }
  function mockPay(sku) {
    const p = E.PRODUCTS[sku];
    modalQueue.unshift({ html: '<h2>가상 결제</h2><p><b>' + p.name + '</b><br>' + won(p.price) + '</p><p>프로토타입이라 실제 결제는 일어나지 않습니다. 정식 버전에서는 이 자리에 앱 마켓 결제 창이 뜹니다.</p>',
      buttons: [{ label: '가상 결제 완료', primary: true, fn: () => { if (E.mockBuy(st, sku, today(), shiftDay(29))) { say(p.name + ' 구매 완료 (가상).'); save(); update(true); buildShop(); } } }, { label: '취소' }] });
    showNextModal();
  }

  // ---------- 화면 갱신 ----------
  let renderedTier = 0, genRows = {}, petShown = null;
  function say(text) { $('ticker').textContent = text; }

  function buildGens() {
    const box = $('panel-gens'); box.innerHTML = ''; genRows = {};
    let shownLocked = false;
    E.GENS.forEach((g) => {
      const unlocked = E.genUnlocked(st, g.id);
      if (!unlocked) { if (shownLocked) return; shownLocked = true; }
      const row = document.createElement('div');
      row.className = 'row' + (unlocked ? '' : ' locked');
      row.innerHTML = '<div><div class="name">' + g.name + '<span class="own num"></span></div><div class="note">' + g.note + '</div><div class="meta num"></div></div>' +
        '<button class="buy" id="buy-' + g.id + '"><b class="num"></b><small></small></button>';
      const btn = row.querySelector('button');
      btn.addEventListener('click', () => { if (E.buyGen(st, g.id)) { say(g.name + (['intern', 'junior', 'postdoc'].includes(g.id) ? '을(를) 뽑았다.' : '을(를) 들였다.')); update(); } });
      box.appendChild(row);
      genRows[g.id] = { own: row.querySelector('.own'), meta: row.querySelector('.meta'), btn, cost: btn.querySelector('b'), small: btn.querySelector('small'), unlocked };
    });
  }
  function updateGens() {
    E.GENS.forEach((g) => {
      const r = genRows[g.id]; if (!r) return;
      const n = st.gens[g.id];
      r.own.textContent = n ? '×' + n : '';
      if (!r.unlocked) { r.meta.textContent = E.TIERS[g.tier].name + '부터 고용할 수 있다'; r.btn.disabled = true; r.cost.textContent = '잠김'; r.small.textContent = ''; return; }
      const nextMs = E.MILESTONES.find((m) => n < m);
      r.meta.textContent = '1대당 초당 ' + fmt(E.genRate(st, g) * E.globalMult(st)) + (nextMs ? ' · ' + nextMs + '대 보유 시 효율 2배' : ' · 효율 최대');
      const c = E.genCost(st, g.id);
      r.cost.textContent = fmt(c); r.small.textContent = '고용·구매';
      r.btn.disabled = st.data < c;
    });
  }
  function buildTap() {
    $('panel-tap').innerHTML = '<div class="row"><div><div class="name">타자 속도 <span class="own num" id="tapLv"></span></div><div class="note">손가락이 빨라지면 탭 1번에 데이터 2배</div><div class="meta num" id="tapMeta"></div></div><button class="buy" id="tapBuy"><b class="num" id="tapCost"></b><small>강화</small></button></div>' +
      '<div class="row"><div><div class="name">지금 붙어 있는 배율</div><div class="meta" id="tierBonus"></div></div><span></span></div>';
    $('tapBuy').addEventListener('click', () => { if (E.buyTap(st)) { say('타자 연습을 했다. 탭이 2배 강해졌다.'); update(); } });
  }

    let h = '<div class="notice">프로토타입 BM 시뮬레이션입니다. 실제 결제와 실제 광고는 없습니다.</div>';

    $('adSkill').addEventListener('click', () => watchAd('skill', 0, () => { say('에너지 드링크를 마셨다. 스킬을 다시 쓸 수 있다.'); buildShop(); }));

    }));

  function colPct() {
    const keys = Object.keys(E.COLLECTION);
    const have = keys.reduce((a, k) => a + E.colCount(st, k), 0), all = keys.reduce((a, k) => a + E.colTotal(k), 0);
    return Math.floor((have / all) * 100);
  }
  function buildCol() {
    const box = $('panel-col');
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let h = '<div class="notice">랩실 도감은 재입학해도 남습니다. 모든 항목은 플레이로만 얻고, 결제로는 얻을 수 없습니다. 이미 가진 항목이 나오면 커피 쿠폰 1개로 바뀌고, 중복이 ' + E.PITY + '번 쌓이면 다음에는 새 항목이 확정으로 나옵니다. 전체 ' + colPct() + '% 수집.</div>';
    Object.keys(E.COLLECTION).forEach((k) => {
      const c = E.COLLECTION[k], n = E.colCount(st, k), total = E.colTotal(k), done = E.colSetDone(st, k);
      h += '<div class="sheet"><div class="colhead"><b>' + c.name + '</b><span class="num">' + n + '/' + total + '</span></div>' +
        '<div class="colmeta">얻는 법: ' + c.source + (c.chance < 1 ? ' ' + Math.round(c.chance * 100) + '%' : '') + ' · ' + c.each + '<br>세트 보너스: <span class="' + (done ? 'done' : '') + '">' + c.set + (done ? ' (적용 중)' : '') + '</span>' +
        (c.items ? ' · 중복 ' + ((st.col.pity || {})[k] || 0) + '/' + E.PITY : '') + '</div><div class="grid">';
      if (c.items) {
        c.items.forEach((it, i) => {
          const own = st.col[k][i], rar = E.RARITY[it[1]];
          h += '<div class="item ' + it[1] + (own ? ' owned' : ' missing') + '"><span class="rar ' + it[1] + '">' + rar.name + ' · ' + E.dropRate(k, i).toFixed(1) + '%</span>' +
            (own ? '<span class="' + (k === 'quotes' ? 'q' : '') + '">' + (k === 'quotes' ? '“' + esc(it[0]) + '”' : esc(it[0])) + '</span>' + (own > 1 ? '<span class="colmeta num">×' + own + '</span>' : '') : '<span>???</span>') + '</div>';
        });
      } else if (k === 'topics') {
        E.TOPICS.forEach((t, i) => {
          const cnt = st.col.topics[i] || 0, stars = E.TOPIC_STARS.filter((x) => cnt >= x).length;
          h += '<div class="item' + (cnt ? ' owned' : ' missing') + '"><span class="stars" aria-label="별 ' + stars + '개">' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '</span><span>' + (cnt ? esc(t) : '???') + '</span><span class="colmeta num">논문 ' + cnt + '편' + (stars < 3 ? ' · 다음 별 ' + E.TOPIC_STARS[stars] + '편' : '') + '</span></div>';
        });
      } else {
        for (let t = 1; t <= E.LAST; t++) {
          const own = st.col.photos[t];
          h += '<div class="item' + (own ? ' owned' : ' missing') + '">' + (own ? charSVG(t) + '<span>' + E.TIERS[t].name + '</span>' : '<span>???</span><span class="colmeta">' + t + '단계</span>') + '</div>';
        }
      }
      h += '</div></div>';
    });
    box.innerHTML = h;
  }
  function mmss(sec) { const m = Math.floor(sec / 60); return m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60) + '분' : m + '분'; }
  function buildTree() {
    const box = $('panel-tree'); box.innerHTML = '';
    for (let t = 1; t <= E.LAST; t++) {
      const info = E.TIERS[t], reached = st.promotedAt.filter((p) => p.tier === t).pop();
      const el = document.createElement('div');
      el.className = 'tier' + (reached ? ' done' : '') + (t === st.tier ? ' now' : '');
      const hidden = !reached && t > st.tier + 1 && t >= E.LAST - 1 && st.bestTier < t;
      const cond = t === 1 ? '입학' : '논문 ' + E.CFG.needs[t] + '편' + (t === E.LAST ? ' + 세기의 연구' : '');
      el.innerHTML = '<span class="n">' + t + '</span><div><b>' + (hidden ? '???' : info.name) + '</b> <span class="meta">' + (hidden ? '' : info.title) + '</span><div class="meta">' + (hidden ? '조건 비공개' : cond) + '</div></div><span class="meta num">' + (reached ? mmss(reached.time) : '') + '</span>';
      box.appendChild(el);
    }
  }
  function buildRec() {
    const box = $('panel-rec');
    const titles = st.paperTitles.slice().reverse().map((t, i) => '<li>[' + (st.paperTitles.length - i) + '] ' + t + '</li>').join('') || '<li>아직 논문이 없다.</li>';
    box.innerHTML = '<div class="sheet"><div class="stats num"><span>플레이 시간<b>' + mmss(st.time) + '</b></span><span>총 탭<b>' + st.taps.toLocaleString('ko-KR') + '</b></span><span>누적 데이터<b>' + fmt(st.total) + '</b></span><span>레벨<b>' + st.lv + '</b></span><span>황금 월계관<b>' + st.medals + '개</b></span><span>도감<b>' + colPct() + '%</b></span><span>최고 직급<b>' + E.TIERS[st.bestTier].name + '</b></span></div></div>' +
      '<div class="sheet"><b>게재 논문</b><div class="log"><ol>' + titles + '</ol></div></div>' +
      '<div class="sheet" style="display:grid;gap:8px"><button class="btn danger" id="resetBtn"><span class="t">처음부터 다시 하기</span><span class="s">진행·도감·쿠폰·구매 내역이 모두 지워집니다</span></button><div id="resetConfirm" hidden style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" id="resetYes"><span class="t">정말 지우기</span></button><button class="btn" id="resetNo"><span class="t">취소</span></button></div></div>';
    $('resetBtn').addEventListener('click', () => { $('resetConfirm').hidden = false; });
    $('resetNo').addEventListener('click', () => { $('resetConfirm').hidden = true; });
    $('resetYes').addEventListener('click', () => { st = E.newGame(); refreshDay(); renderedTier = 0; save(); say('새 학기, 새 연구실. 다시 석사과정이다.'); update(true); buildRec(); });
  }
  function buildAutos() {
    const box = $('autos'); box.innerHTML = '';
    Object.keys(E.AUTOS).forEach((id) => {
      const a = E.AUTOS[id];
      const b = document.createElement('button');
      b.className = 'toggle'; b.id = 'auto-' + id;
      b.innerHTML = '<span class="t">' + a.name + '</span><span class="s"></span>';
      b.addEventListener('click', () => { if (E.setAuto(st, id, !st.auto[id])) { say(a.name + (st.auto[id] ? '을 켰다. ' + a.desc + '.' : '을 껐다.')); update(); } });
      box.appendChild(b);
    });
  }
  function updateAutos() {
    Object.keys(E.AUTOS).forEach((id) => {
      const b = $('auto-' + id); if (!b) return;
      const a = E.AUTOS[id], locked = st.tier < a.tier;
      b.disabled = locked; b.setAttribute('aria-pressed', st.auto[id] && !locked ? 'true' : 'false');
      b.querySelector('.s').textContent = locked ? E.TIERS[a.tier].name + '부터' : a.desc;
    });
  }

  function update(full) {
    $('data').textContent = fmt(st.data);
    $('ps').textContent = fmt(E.perSec(st) + E.petPerSec(st));
    $('pt').textContent = fmt(E.perTap(st));
    $('papers').textContent = st.papers;
    $('coupons').textContent = st.coupons;
    $('lv').textContent = 'Lv ' + st.lv;
    $('expBar').style.width = Math.min(100, (st.exp / E.expNeed(st.lv)) * 100) + '%';
    $('lvBonus').textContent = '생산·탭 +' + Math.round(E.CFG.levelBonus * 100 * st.lv) + '%';
    if (renderedTier !== st.tier || petShown !== st.pet) {
      renderedTier = st.tier; petShown = st.pet;
      $('tierName').textContent = E.TIERS[st.tier].name; $('tierTitle').textContent = E.TIERS[st.tier].title;
      $('tapper').innerHTML = charSVG(st.tier) + (st.pet ? CAT_SVG : '');
      buildGens(); buildTap(); buildSkills(); buildAutos(); full = true;
    }
    const pc = E.paperCost(st);
    $('writeCost').textContent = '데이터 ' + fmt(pc) + ' · 생산 +' + Math.round(E.CFG.paperBonus * 100) + '%';
    $('writeBtn').disabled = st.data < pc || st.ended;
    const nt = E.nextTier(st);
    if (nt) {
      const need = E.nextNeed(st), prev = E.CFG.needs[st.tier];
      $('nextLabel').textContent = '다음 전직: ' + nt.name;
      $('nextCount').textContent = '논문 ' + Math.min(st.papers, need) + '/' + need + '편';
      $('nextBar').style.width = Math.min(100, ((st.papers - prev) / Math.max(1, need - prev)) * 100) + '%';
    } else { $('nextLabel').textContent = '최종 직급'; $('nextCount').textContent = ''; $('nextBar').style.width = '100%'; }
    const showCentury = st.tier === E.LAST - 1 && !st.century;
    $('centuryBtn').hidden = !showCentury;
    if (showCentury) {
      const ready = st.papers >= E.CFG.needs[E.LAST];
      $('centuryCost').textContent = ready ? '데이터 ' + fmt(E.CFG.century) + '로 세기의 연구를 완성한다' : '논문 ' + E.CFG.needs[E.LAST] + '편을 채우면 시작할 수 있다';
      $('centuryBtn').disabled = !ready || st.data < E.CFG.century;
    }
    $('promoteBtn').hidden = !E.canPromote(st);
    if (nt && E.canPromote(st)) $('promoteBtn').textContent = nt.name + '(으)로 전직하기';
    updateGens(); updateTap(); updateSkills(); updateBuffs(); updateAutos();
    drainNotes();
    if (full && tab === 'tree') buildTree();
  }
  function toast(text) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = text;
    $('lab').appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }
  function drainNotes() {
    if (!st.notes.length) return;
    const notes = st.notes.splice(0);
    const last = notes[notes.length - 1];
    say(last.text);
    const got = notes.filter((n) => n.kind === 'collect');
    if (got.length) { toast(got.length > 1 ? got[got.length - 1].text + ' 외 ' + (got.length - 1) + '건' : got[0].text); if (tab === 'col') buildCol(); }
    if (notes.some((n) => n.kind === 'level')) { const r = $('lab').getBoundingClientRect(); floatAt(r.width / 2, 40, 'LEVEL UP', 'lvup'); }
    if (notes.some((n) => n.kind === 'paper') && tab === 'rec') buildRec();
  }

  function buildSkills() {
    const box = $('skills'); box.innerHTML = '';
    Object.keys(E.SKILLS).forEach((id) => {
      const s = E.SKILLS[id];
      const b = document.createElement('button');
      b.className = 'btn'; b.id = 'skill-' + id;
      b.innerHTML = '<span class="t">' + s.name + '</span><span class="s num"></span>';
      b.addEventListener('click', () => { if (E.useSkill(st, id)) { say(id === 'night' ? '밤을 새우기로 했다. 손가락이 불탄다.' : '내일이 마감이다. 연구실 전체가 달린다.'); update(); } });
      box.appendChild(b);
    });
  }
  function updateSkills() {
    Object.keys(E.SKILLS).forEach((id) => {
      const b = $('skill-' + id); if (!b) return;
      const s = E.SKILLS[id], small = b.querySelector('.s');
      if (st.tier < s.tier) { b.disabled = true; small.textContent = E.TIERS[s.tier].name + '부터'; return; }
      const left = Math.ceil(st.skills[id] - st.time);
      b.disabled = left > 0;
      small.textContent = left > 0 ? '다시 쓰기까지 ' + left + '초' : s.desc;
    });
  }
  function updateBuffs() {
    const html = st.buffs.filter((b) => b.until > st.time).map((b) => '<span class="chip num">' + b.src + ' ' + (b.kind === 'tap' ? '탭' : '생산') + ' ×' + b.mult + ' · ' + mmssShort(b.until - st.time) + '</span>').join('');
    if ($('buffs').innerHTML !== html) $('buffs').innerHTML = html;
  }
  const mmssShort = (s) => { const t = Math.ceil(s), m = Math.floor(t / 60); return (m ? m + '분 ' : '') + (t % 60) + '초'; };

  // ---------- 입력 ----------
  function floatAt(x, y, text, cls) {
    const el = document.createElement('span');
    el.className = 'float num' + (cls ? ' ' + cls : ''); el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    $('lab').appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
  function doTap(x, y) {
    if (st.ended) return;
    const now = performance.now();
    while (tapTimes.length && now - tapTimes[0] > 1000) tapTimes.shift();
    if (tapTimes.length >= MAX_TPS) return;
    tapTimes.push(now);
    const v = E.tap(st);
    const t = $('tapper'); t.classList.add('hit'); setTimeout(() => t.classList.remove('hit'), 70);
    floatAt(x, y, '+' + fmt(v));
    if (st.taps === 1) $('hint').hidden = true;
  }
  $('tapper').addEventListener('pointerdown', (e) => {
    const r = $('lab').getBoundingClientRect();
    doTap(e.clientX - r.left + (Math.random() * 30 - 15), e.clientY - r.top - 10);
  });
  $('tapper').addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); const r = $('lab').getBoundingClientRect(); doTap(r.width / 2, r.height / 2 - 40); }
  });
  $('tapper').addEventListener('click', (e) => e.preventDefault());
  $('couponBtn').addEventListener('click', () => $('tab-shop').click());

  $('writeBtn').addEventListener('click', () => { const title = E.writePaper(st); if (title) { say('논문 게재: 「' + title + '」'); update(); if (tab === 'rec') buildRec(); } });
  $('centuryBtn').addEventListener('click', () => { if (E.buyCentury(st)) { say('세기의 연구가 완성됐다. 전 세계 연구실이 재현 실험을 시작했다.'); update(); } });
  $('promoteBtn').addEventListener('click', () => {
    const from = st.tier;
    if (!E.promote(st)) return;
    save(); update(true);
    if (st.tier === E.LAST) showEnding(); else showPromotion(from);
  });

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
    ['gens', 'tap', 'col', 'shop', 'tree', 'rec'].forEach((k) => { $('panel-' + k).hidden = k !== tab; });
    if (tab === 'col') buildCol();
    if (tab === 'tree') buildTree();
    if (tab === 'rec') buildRec();
    if (tab === 'shop') buildShop();
    try { localStorage.setItem(KEY + '.tab', tab); } catch (e) {}
  }));

  // ---------- 전직·엔딩 ----------
  const PROMO_LINES = {
    2: '박사과정이 되었다. 후배와 VNA를 들일 수 있고, 후배에게 논문 자동 투고를 맡길 수 있다.',
    3: '박사 학위를 받았다. 탭 1번에 초당 생산의 2%가 더해지고, 자동 고용이 열린다.',
    4: '세 학교를 돌며 강의한다. 강의 자료 보따리가 무겁다. 출강 학교가 데이터를 만든다.',
    5: '교수 공채에 합격했다. 연구실 문패에 내 이름이 걸렸다.',
    6: '테뉴어 심사를 통과했다. 국제 공동연구단을 꾸릴 수 있다.',
    7: '정교수가 되었다. 전파망원경 배열로 우주에서 데이터가 온다.',
    8: '국제학회 펠로우로 선정됐다. 세기의 연구에 도전할 수 있다.',
  };
  function showPromotion(from) {
    const t = st.tier, info = E.TIERS[t];
    const unlocked = E.GENS.filter((g) => g.tier === t).map((g) => g.name).join(', ');
    openModal('<span class="bigstamp">전직</span>' + charSVG(t) + '<h2>' + info.name + '</h2><p class="hand">' + info.title + '</p><p>' + PROMO_LINES[t] + '</p>' +
      (unlocked ? '<p><b>새로 열림:</b> ' + unlocked + '</p>' : '') + '<p>도감에 「' + info.name + '」 기념사진이 붙었다.</p><p class="num">자동 생산 ×' + E.CFG.tierProd + ', 탭 ×' + E.CFG.tierTap + '</p>', [{ label: '계속 연구한다', primary: true }]);
    say(E.TIERS[from].name + '에서 ' + info.name + '(으)로 전직했다!');
  }
  function showEnding() {
    openModal('<span class="bigstamp">전설</span>' + charSVG(E.LAST) + '<h2>살아있는 교과서</h2><p class="hand">인류의 지성</p><p>「' + st.paperTitles[st.paperTitles.length - 1] + '」이 교과서 첫 장에 실렸다.</p>' +
      '<div class="stats num"><span>걸린 시간<b>' + mmss(st.time) + '</b></span><span>논문<b>' + st.papers + '편</b></span><span>레벨<b>' + st.lv + '</b></span><span>누적 데이터<b>' + fmt(st.total) + '</b></span></div>' +
      '<p>재입학하면 황금 월계관 1개를 쓰고 석사과정부터 다시 시작합니다. 월계관 1개마다 생산과 탭이 영구히 50% 늘어납니다. 랩실 도감·쿠폰·야옹·구매 내역은 그대로 남습니다. 도감 ' + colPct() + '% 수집.</p>',
      [{ label: '황금 월계관을 쓰고 재입학', primary: true, fn: () => { const prev = st; prev.medals++; st = E.newGame(prev); refreshDay(); renderedTier = 0; save(); say('월계관을 쓰고 다시 석사과정에 입학했다. 동기들이 수군거린다.'); update(true); } },
       { label: '이대로 감상하기' }]);
  }

  // ---------- 지나가는 교수님 ----------
  function spawnProf() {
    if (st.ended || $('lab').querySelector('.prof')) return;
    const b = document.createElement('button');
    b.className = 'prof'; b.innerHTML = '<em aria-hidden="true">🧑‍🏫</em> 교수님';
    b.setAttribute('aria-label', '지나가는 교수님 잡기');
    b.addEventListener('click', (e) => { e.stopPropagation(); const r = E.profReward(st); say(r.text); b.remove(); update(); });
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('animationend', () => b.remove());
    $('lab').appendChild(b);
  }

  // ---------- 방치 보상 ----------
  function grantOffline(seconds) {
    if (!(seconds > 30)) return;
    const r = E.offline(st, seconds);
    if (r.gain <= 0 && r.levels <= 0) return;
    const lines = ['데이터 <b class="num">+' + fmt(r.gain) + '</b>'];
    if (r.levels) lines.push('레벨 <b class="num">+' + r.levels + '</b> (지금 Lv ' + st.lv + ')');
    if (r.papers) lines.push('후배가 대신 낸 논문 <b class="num">' + r.papers + '편</b>');
    const capNote = r.capped ? '<p class="meta">' + r.capH + '시간까지만 쌓였다.' + (st.subActive ? '' : ' 정기구독이면 12시간, 효율 100%.') + '</p>' : '';
    const adOk = E.adLeft(st, 'offline') > 0;
    openModal('<h2>다녀오셨어요</h2><p class="hand">자리를 비운 ' + mmss(r.seconds) + ' 동안 (효율 ' + Math.round(r.eff * 100) + '%)</p><p>' + lines.join('<br>') + '</p>' + capNote,
      [{ label: '받기', primary: true }, { label: (st.shop.noAds ? '데이터 2배로 받기' : '광고 보고 데이터 2배') + (adOk ? '' : ' (오늘 광고 소진)'), disabled: !adOk, fn: () => watchAd('offline', r.gain, () => say('방치 보상을 2배로 받았다. 데이터 +' + fmt(r.gain))) }]);
    save();
  }
  function maybeAttend() {
    if (!E.attendReady(st)) return;
    openModal('<h2>출석 ' + st.daily.streak + '일째</h2><p class="hand">오늘도 연구실에 나왔다</p><p>커피 쿠폰 <b class="num">+' + E.attendReward(st) + '</b></p>',
      [{ label: '받기', primary: true, fn: () => { const v = E.claimAttend(st); say('출석 보상: 커피 쿠폰 +' + v); save(); update(); if (tab === 'shop') buildShop(); } }]);
  }

  // ---------- 루프 ----------
  function frame(now) {
    const dt = Math.min(1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    if (!document.hidden && $('modal').hidden) {
      E.tick(st, dt);
      if (st.pet && !st.ended) { petClock += dt; if (petClock >= 1) { petClock = 0; const r = $('lab').getBoundingClientRect(); floatAt(r.width - 50, r.height - 70, '+' + fmt(E.CFG.petTps * E.perTap(st)), 'pet'); } }
      if (st.time >= nextProfAt) { spawnProf(); nextProfAt = st.time + 60 + Math.random() * 60; }
    }
    requestAnimationFrame(frame);
  }
  setInterval(() => update(), 150);
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); return; }
    const away = (Date.now() - hiddenAt) / 1000;
    const day = st.daily.day; refreshDay();
    if (hiddenAt) grantOffline(away);
    if (day !== st.daily.day) maybeAttend();
    lastFrame = performance.now();
  });

  function start(data) {
    const saved = data && data.st ? data : load();
    const restored = saved && E.migrate(saved.st);
    st = restored || E.newGame();
    refreshDay();
    if (restored) grantOffline((Date.now() - (saved.at || Date.now())) / 1000);
    maybeAttend();
    nextProfAt = st.time + 40;
    try { const t = localStorage.getItem(KEY + '.tab'); if (t) { const b = document.querySelector('.tabs button[data-tab="' + t + '"]'); if (b) b.click(); } } catch (e) {}
    update(true);
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ st, at: Date.now() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
