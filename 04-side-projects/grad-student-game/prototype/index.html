<title>대학원생 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 연구노트 모눈종이 위에 왼쪽은 탭하는 캐릭터, 오른쪽은 고용·상점·전직 탭. 폰에서는 한 줄로 쌓는다. */
:root {
  --paper: #f3f6f9; --grid: #dbe5ee; --card: #ffffff; --line: #c8d4e0;
  --ink: #1b2838; --muted: #5a6879; --accent: #2346a3; --accent-ink: #ffffff;
  --stamp: #c3303a; --good: #2b7a4b; --gold: #a86a00; --soft: #e7eef8; --scrim: rgba(10, 16, 28, 0.55);
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Nanum Pen Script", "Apple SD Gothic Neo", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1828; --grid: #19283d; --card: #142238; --line: #2a3f5c;
  --ink: #e5edf7; --muted: #93a4b9; --accent: #8eaeff; --accent-ink: #0e1828;
  --stamp: #ff6d75; --good: #6fd39a; --gold: #f0b552; --soft: #1b2d48; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0e1828; --grid: #19283d; --card: #142238; --line: #2a3f5c;
  --ink: #e5edf7; --muted: #93a4b9; --accent: #8eaeff; --accent-ink: #0e1828;
  --stamp: #ff6d75; --good: #6fd39a; --gold: #f0b552; --soft: #1b2d48; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 상단 */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: 0.02em; margin: 0; }
.brand small { font-family: var(--font-hand); font-size: 1.25rem; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.topright { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: baseline; gap: 8px; border: 2px solid var(--ink); padding: 2px 10px; background: var(--card); }
.badge b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.badge span { font-family: var(--font-hand); font-size: 1.2rem; color: var(--muted); }
.coupon { border: 2px solid var(--gold); color: var(--gold); background: var(--card); padding: 2px 10px; cursor: pointer; font-weight: 600; }
.drinkbox { display: inline-flex; align-items: stretch; border: 2px solid var(--good); background: var(--card); }
.drinkbox span { padding: 2px 8px; color: var(--good); font-weight: 600; }
.drinkbox button { border: 0; border-left: 2px solid var(--good); background: var(--good); color: var(--card); padding: 2px 10px; font-weight: 600; cursor: pointer; }
.drinkbox button:disabled { opacity: 0.45; cursor: not-allowed; }

.main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .main { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); align-items: start; } .left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.left, .right { display: grid; gap: 12px; min-width: 0; }
.sheet { background: var(--card); border: 1px solid var(--line); padding: 14px; min-width: 0; }

/* 데이터·레벨 */
.meter { display: grid; gap: 4px; }
.meter .label { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); }
.meter .big { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 2.6rem); line-height: 1.1; }
.rates { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 0.9rem; }
.rates b { color: var(--ink); font-weight: 600; }
.level { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.level b { font-family: var(--font-display); font-weight: 400; color: var(--ink); font-size: 1rem; }
.bar { height: 8px; background: var(--soft); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--good); width: 0; transition: width 200ms; }

/* 탭 영역 */
.lab { position: relative; overflow: hidden; height: 300px; border: 1px solid var(--line); background: var(--soft); }
.tapper { position: absolute; inset: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.tapper .scene { width: 100%; height: 100%; display: block; }
/* 연구실 장면: 모드마다 보이는 소품과 팔 모양이 바뀐다 */
.scene .m-type, .scene .m-exp, .scene .m-an, .scene .m-think { display: none; }
.scene.mode-type .m-type, .scene.mode-exp .m-exp, .scene.mode-an .m-an, .scene.mode-think .m-think { display: inline; }
.scene .who { animation: breathe 3.2s ease-in-out infinite; }
.scene .jump { transition: transform 70ms ease-out; }
.tapper.hit .jump { transform: translateY(-7px); }
.scene .a1 { animation: typeA 0.26s ease-in-out infinite alternate; }
.scene .a2 { animation: typeA 0.26s ease-in-out 0.13s infinite alternate; }
.scene .flaskG { transform-box: view-box; transform-origin: 292px 176px; animation: swirl 1.1s ease-in-out infinite alternate; }
.scene .bub { animation: rise 1.7s linear infinite; }
.scene .bub.b2 { animation-delay: 0.55s; } .scene .bub.b3 { animation-delay: 1.1s; }
.scene .graph { stroke-dasharray: 200; animation: draw 2.6s linear infinite; }
.scene .qmark { animation: blink 2.4s steps(1) infinite; }
.scene .bulb { animation: blink 2.4s steps(1) 1.2s infinite; opacity: 0; }
.scene.mode-think .scribble { stroke-dasharray: 160; animation: draw 3s linear infinite; }
.scene .screen { animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes breathe { 50% { transform: translateY(2px); } }
@keyframes typeA { to { transform: translateY(-4px); } }
@keyframes swirl { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-30px); opacity: 0; } }
@keyframes draw { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
.hint { position: absolute; left: 10px; bottom: 4px; font-family: var(--font-hand); font-size: 1.25rem; color: #fff8ee; text-shadow: 0 1px 2px #5a3d1e; pointer-events: none; }
.float { position: absolute; pointer-events: none; font-family: var(--font-display); font-size: 1.1rem; color: var(--accent); animation: up 900ms ease-out forwards; white-space: nowrap; }
.float.lvup { color: var(--good); font-size: 1.4rem; }
.float.pet { color: var(--gold); font-size: 0.95rem; }
@keyframes up { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -70px); opacity: 0; } }
.prof { position: absolute; top: 18px; left: -70px; border: 2px dashed var(--stamp); background: var(--card); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.9rem; animation: fly 12s linear forwards; z-index: 2; }
.prof em { font-style: normal; font-size: 1.4rem; vertical-align: middle; }
@keyframes fly { 0% { left: -120px; top: 18px; } 50% { top: 60px; } 100% { left: calc(100% + 20px); top: 24px; } }
.buffs { position: absolute; right: 8px; top: 8px; display: grid; gap: 4px; justify-items: end; pointer-events: none; }
.chip { background: var(--accent); color: var(--accent-ink); font-size: 0.78rem; padding: 2px 8px; font-weight: 600; }
.tapper .cat { position: absolute; right: 14px; bottom: 8px; width: 64px; height: 56px; pointer-events: none; transform: none; }
.cat .paw { transform-origin: 20px 42px; animation: paw 333ms ease-in-out infinite; }
@keyframes paw { 50% { transform: rotate(-24deg); } }

.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 2px solid var(--ink); background: var(--card); padding: 8px 10px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .t { font-weight: 600; }
.btn .s { font-size: 0.8rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary .s { color: inherit; opacity: 0.85; }
.btn.center { text-align: center; }

/* 논문·전직 */
.paper { display: grid; gap: 10px; }
.next { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; color: var(--muted); flex-wrap: wrap; }
.stampbtn { border: 3px double var(--stamp); color: var(--stamp); background: var(--card); font-family: var(--font-display); font-size: 1.3rem; padding: 8px; cursor: pointer; transform: rotate(-2deg); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: rotate(-2deg) scale(1.04); } }
.autos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { border: 2px solid var(--line); background: var(--card); padding: 6px 10px; cursor: pointer; text-align: left; display: grid; gap: 0; }
.toggle .t { font-weight: 600; font-size: 0.9rem; }
.toggle .s { font-size: 0.75rem; color: var(--muted); }
.toggle[aria-pressed="true"] { border-color: var(--good); }
.toggle[aria-pressed="true"] .t::after { content: " ON"; color: var(--good); }
.toggle:disabled { opacity: 0.45; cursor: not-allowed; }

/* 탭 메뉴 */
.tabs { display: flex; border-bottom: 2px solid var(--ink); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 10px 12px; }
.row .name { font-weight: 600; }
.row .name .own { font-family: var(--font-display); font-weight: 400; color: var(--accent); margin-left: 6px; }
.row .note { font-family: var(--font-hand); font-size: 1.15rem; color: var(--muted); line-height: 1.2; }
.row .meta { font-size: 0.82rem; color: var(--muted); }
.row.locked { opacity: 0.5; }
.buy { border: 2px solid var(--ink); background: var(--card); padding: 6px 10px; cursor: pointer; min-width: 92px; text-align: right; }
.buy:not(:disabled):hover { background: var(--soft); }
.buy:disabled { opacity: 0.4; cursor: not-allowed; }
.buy b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.buy small { color: var(--muted); font-size: 0.75rem; }
.buy.gold { border-color: var(--gold); }
.h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; margin: 8px 0 0; }
.notice { border: 2px dashed var(--gold); padding: 8px 12px; font-size: 0.88rem; background: var(--card); }

.tree { display: grid; gap: 6px; }
.tier { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); }
.tier .n { font-family: var(--font-display); font-size: 1.2rem; color: var(--muted); }
.tier.done .n { color: var(--good); }
.tier.now { border: 2px solid var(--accent); }
.tier .meta { font-size: 0.82rem; color: var(--muted); }

.colhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.colhead b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.colmeta { font-size: 0.82rem; color: var(--muted); }
.colmeta .done { color: var(--good); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 8px; }
.item { border: 1px solid var(--line); padding: 6px 8px; font-size: 0.85rem; background: var(--card); display: grid; gap: 2px; min-width: 0; }
.item .rar { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; }
.item .rar.c { color: var(--muted); } .item .rar.r { color: var(--accent); } .item .rar.e { color: #8a4fd1; } .item .rar.l { color: var(--gold); }
.item.e.owned { border: 2px solid #8a4fd1; }
/* 눈 충혈: f1~f3 단계마다 흰자가 붉어지고 실핏줄이 짙어지며, 3단계에서 눈꺼풀이 반쯤 감긴다 */
.scene.f1 .sclera { fill: #ffe6e6; } .scene.f1 .veins { opacity: 0.35; }
.scene.f2 .sclera { fill: #ffcccc; } .scene.f2 .veins { opacity: 0.75; }
.scene.f3 .sclera { fill: #ffaaaa; } .scene.f3 .veins { opacity: 1; } .scene.f3 .lid { opacity: 1; }
.scene .steam { animation: rise 1.8s linear infinite; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.tier[role="button"] { cursor: pointer; } .tier[role="button"]:hover { background: var(--soft); }
.wardrobe { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px; align-items: center; }
@media (max-width: 480px) { .wardrobe { grid-template-columns: 1fr; justify-items: center; } }
.wardrobe svg { width: 150px; height: 166px; }
.avstats { display: grid; gap: 2px; font-size: 0.86rem; }
.gender { display: flex; gap: 6px; flex-wrap: wrap; }
.gender button { border: 1px solid var(--line); background: var(--card); padding: 4px 12px; cursor: pointer; }
.gender button[aria-pressed="true"] { border: 2px solid var(--accent); font-weight: 600; }
button.item { font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.item:disabled { cursor: not-allowed; }
.item.wearing { border: 2px solid var(--good); }
.item .wear { font-size: 0.72rem; color: var(--good); font-weight: 600; }
.item .price { font-size: 0.78rem; color: var(--gold); font-weight: 600; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.picks div { display: grid; justify-items: center; gap: 4px; }
.picks svg { width: 120px; height: 133px; }
.preview { text-align: left; display: grid; gap: 4px; font-size: 0.9rem; }
.preview li { margin-left: 1em; }
.item.l.owned { border: 2px solid var(--gold); }
.item.missing { background: var(--soft); color: var(--muted); }
.item .q { font-family: var(--font-hand); font-size: 1.15rem; line-height: 1.15; }
.item svg { width: 54px; height: 60px; }
.stars { color: var(--gold); letter-spacing: 2px; }
.toast { position: absolute; left: 8px; right: 8px; top: 8px; background: var(--card); border: 2px solid var(--gold); padding: 6px 10px; font-size: 0.85rem; font-weight: 600; z-index: 3; pointer-events: none; animation: toast 2.8s ease-out forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.proj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 10px 12px; }
.grade { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 6px; border: 1px solid currentColor; margin-right: 6px; vertical-align: 1px; }
.grade.g1 { color: var(--good); } .grade.g2 { color: var(--accent); } .grade.g3 { color: var(--gold); }
.run { display: grid; gap: 4px; background: var(--card); border: 2px solid var(--good); padding: 8px 12px; }
.run .bar i { background: var(--good); }
.rankme { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px 12px; font-size: 0.88rem; }
.rankme b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.join { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.join input { font: inherit; padding: 7px 10px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); min-width: 0; flex: 1 1 160px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--card); padding: 4px 10px; cursor: pointer; font-size: 0.85rem; }
.chips button[aria-pressed="true"] { border: 2px solid var(--accent); font-weight: 600; }
.ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ranks li { display: grid; grid-template-columns: 2rem 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 6px 10px; }
.ranks li.me { border: 2px solid var(--accent); }
.ranks .pos { font-family: var(--font-display); font-size: 1.1rem; color: var(--muted); text-align: right; }
.ranks li:nth-child(1) .pos { color: var(--gold); }
.ranks img { width: 28px; height: 28px; border-radius: 50%; }
.ranks .who2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranks .sub { font-size: 0.78rem; color: var(--muted); }
.ranks .val { font-family: var(--font-display); font-size: 1.05rem; }
.log { display: grid; gap: 4px; font-size: 0.9rem; max-height: 260px; overflow-y: auto; }
.log ol { margin: 0; padding: 0; }
.log li { list-style: none; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.ticker { font-family: var(--font-hand); font-size: 1.3rem; line-height: 1.3; min-height: 1.6em; }

/* 모달 */
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--card); border: 2px solid var(--ink); max-width: 420px; width: 100%; max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; display: grid; gap: 12px; text-align: center; }
.dialog h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; margin: 0; text-wrap: balance; }
.dialog p { margin: 0; }
.dialog .hand { font-family: var(--font-hand); font-size: 1.4rem; color: var(--muted); }
.dialog svg { width: 150px; height: 165px; justify-self: center; }
.adbox { border: 2px solid var(--line); background: var(--soft); height: 140px; display: grid; place-items: center; font-family: var(--font-display); font-size: 3rem; color: var(--muted); }
.bigstamp { justify-self: center; border: 4px double var(--stamp); color: var(--stamp); font-family: var(--font-display); font-size: 1.6rem; padding: 2px 16px; transform: rotate(-8deg); animation: stamp 420ms cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; text-align: left; font-size: 0.92rem; }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.danger { border-color: var(--stamp); color: var(--stamp); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } .prof { animation: none; left: 12px; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">대학원생 키우기 <small>석사 입학부터 살아있는 교과서까지</small></h1>
    <div class="topright">
      <button class="coupon num" id="couponBtn" aria-label="커피 쿠폰, 상점 열기">☕ <span id="coupons">0</span></button>
      <div class="drinkbox num" title="에너지 드링크: 마시면 5분 동안 탭·자동 생산 2배"><span>🥤 <span id="drinks">0</span></span><button id="drinkBtn" aria-label="에너지 드링크 마시기">마시기</button></div>
      <div class="badge"><b id="tierName">석사과정</b><span id="tierTitle">랩실 막내</span></div>
    </div>
  </header>

  <div class="main">
    <section class="left" aria-label="연구실">
      <div class="sheet meter">
        <span class="label">연구 데이터</span>

    showNextModal();

    Object.keys(E.LAUREL_UPS).forEach((id) => {
      const u = E.LAUREL_UPS[id], lv = E.upLv(st, id), max = lv >= u.max, cost = max ? 0 : u.cost(lv);
      h += '<div class="row"><div><div class="name">' + u.name + ' <span class="own num">Lv ' + lv + '/' + u.max + '</span></div><div class="meta">' + u.desc + (u.max > 1 ? ' (레벨마다)' : '') + '</div></div>' +
        '<button class="buy gold" data-up="' + id + '"' + (max || st.laurels < cost ? ' disabled' : '') + '><b class="num">' + (max ? '최대' : '월계관 ' + cost) + '</b><small>' + (max ? '' : '강화') + '</small></button></div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('[data-up]').forEach((b) => b.addEventListener('click', () => {
      if (E.buyUpgrade(st, b.dataset.up)) { say('「' + E.LAUREL_UPS[b.dataset.up].name + '」 강화 Lv ' + E.upLv(st, b.dataset.up)); save(); buildLaurel(); update(true); }
    }));
  }

  // ---------- 랭킹과 클라우드 저장 (claude.ai에서 열었을 때만) ----------
  // 각자 scores/<내 id> 문서에만 쓰고 모두가 읽는다. 진행 저장본은 data/users/<내 id>/save에 본인만 볼 수 있게 둔다.
  let db = null, userApi = null, myId = null, canWrite = null, rankRows = [], rankSort = 'score', rankErr = '', writeErr = '';
  let lastPush = 0, lastSig = '', pushing = false, cloudReady = false, cloudBusy = false, lastCloudJson = '', ranksBuilt = false;
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  function cleanRow(id, d) {
    return { id, nick: typeof d.nick === 'string' ? d.nick.slice(0, 12) : '', score: num(d.score, 0), bestTier: Math.min(E.LAST, Math.max(1, num(d.bestTier, 1) | 0)), laurels: num(d.laurels, 0), colPct: Math.min(100, num(d.colPct, 0)), projects: num(d.projects, 0), papers: num(d.papers, 0), runs: num(d.runs, 0), bestRun: typeof d.bestRun === 'number' && d.bestRun > 0 ? d.bestRun : null };
  }
  async function initCloud() {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') { renderRank(); return; }
    try { [db, userApi] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { db = null; }
    if (!db) { renderRank(); return; }
    myId = userApi ? await userApi.id() : null;
    canWrite = userApi ? await userApi.can('data.write') : null;
    db.collection('scores').onSnapshot((snap) => { rankRows = snap.docs.filter((d) => d.exists).map((d) => cleanRow(d.id, d.data() || {})); if (tab === 'rank') renderRank(); },
      (e) => { rankErr = e.code; if (tab === 'rank') renderRank(); });
    if (myId) await loadCloud();
    if (tab === 'rank') renderRank();
  }
  async function loadCloud() {
    try {
      const snap = await db.doc('data/users/' + myId + '/save').get();
      if (snap.exists) {
        const d = snap.data() || {};
        if (typeof d.json === 'string' && num(d.at, 0) > localAt + 5000) {
          const s2 = E.migrate(JSON.parse(d.json));
          if (s2) { st = s2; refreshDay(); renderedTier = 0; save(); update(true); toast('다른 기기에서 하던 진행을 불러왔다.'); }
        }
        lastCloudJson = typeof d.json === 'string' ? d.json : '';
      }
      cloudReady = true;
    } catch (e) { cloudReady = false; }
  }
  function saveCloud() {
    if (!db || !myId || !cloudReady || cloudBusy) return;
    const json = JSON.stringify(st);
    if (json === lastCloudJson || json.length > 200000) return;
    cloudBusy = true;
    db.doc('data/users/' + myId + '/save').set({ at: Date.now(), json })
      .then(() => { lastCloudJson = json; })
      .catch((e) => { if (e && e.code === 'invalid_argument') cloudReady = false; })
      .finally(() => { cloudBusy = false; });
  }
  function pushScore(force) {
    if (!db || !myId || !st.rank.join || pushing) return;
    const card = E.scoreCard(st);
    const sig = JSON.stringify(card) + st.rank.nick;
    if (sig === lastSig || (!force && Date.now() - lastPush < 60000)) return;
    pushing = true;
    db.doc('scores/' + myId).set(Object.assign({ nick: st.rank.nick }, card, { updatedAt: Date.now() }))
      .then(() => { lastSig = sig; lastPush = Date.now(); writeErr = ''; })
      .catch((e) => { writeErr = (e && e.code) || 'unavailable'; })
      .finally(() => { pushing = false; if (tab === 'rank') renderRank(); });
  }
  setInterval(() => { pushScore(false); saveCloud(); }, 15000);

  const SORTS = {
    score: { name: '종합 점수', val: (r) => r.score, show: (r) => r.score.toLocaleString('ko-KR') + '점' },
    bestRun: { name: '최단 엔딩', val: (r) => (r.bestRun == null ? Infinity : r.bestRun), asc: true, show: (r) => (r.bestRun == null ? '-' : mmss(r.bestRun)) },
    colPct: { name: '도감', val: (r) => r.colPct, show: (r) => r.colPct + '%' },
    projects: { name: '과제 실적', val: (r) => r.projects, show: (r) => r.projects + '건' },
  };
  function renderRank() {
    const box = $('panel-rank');
    if (!db) {
      box.innerHTML = '<div class="notice">랭킹과 클라우드 저장은 claude.ai에서 이 게임을 열었을 때 켜집니다. 파일로 직접 열면 혼자 플레이만 됩니다.</div>';
      ranksBuilt = false; return;
    }
    if (!ranksBuilt) {
      box.innerHTML = '<div class="sheet"><div class="colhead"><b>내 연구 업적</b><span class="num" id="rkScore"></span></div><div class="rankme num" id="rkMe"></div><p class="meta" style="margin:8px 0 0">점수 = 최고 직급×100 + 받은 월계관×50 + 도감%×5 + 끝낸 과제×2 + 쓴 논문÷2</p></div>' +
        '<div class="sheet" id="rkJoin"></div>' +
        '<div class="chips" id="rkSorts"></div><ol class="ranks" id="rkList"></ol><p class="meta" id="rkFoot"></p>';
      $('rkSorts').innerHTML = Object.keys(SORTS).map((k) => '<button data-sort="' + k + '">' + SORTS[k].name + '</button>').join('');
      $('rkSorts').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { rankSort = b.dataset.sort; renderRank(); }));
      ranksBuilt = true; renderJoin();
    }
    const c = E.scoreCard(st);
    $('rkScore').textContent = c.score.toLocaleString('ko-KR') + '점';
    $('rkMe').innerHTML = '<span>최고 직급<b>' + E.TIERS[c.bestTier].name + '</b></span><span>받은 월계관<b>' + c.laurels + '</b></span><span>도감<b>' + c.colPct + '%</b></span><span>끝낸 과제<b>' + c.projects + '</b></span><span>쓴 논문<b>' + c.papers + '</b></span><span>최단 엔딩<b>' + (c.bestRun == null ? '-' : mmss(c.bestRun)) + '</b></span>';
    $('rkSorts').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.sort === rankSort ? 'true' : 'false'));
    const S = SORTS[rankSort];
    const rows = rankRows.slice().sort((a, b) => (S.asc ? S.val(a) - S.val(b) : S.val(b) - S.val(a)) || b.score - a.score).slice(0, 50);
    const list = $('rkList'); list.innerHTML = '';
    rows.forEach((r, i) => {
      const li = document.createElement('li');
      if (r.id === myId) li.className = 'me';
      li.innerHTML = '<span class="pos num"></span><img alt="" data-id=""><div class="who2"><div class="nm"></div><div class="sub"></div></div><span class="val num"></span>';
      li.querySelector('.pos').textContent = i + 1;
      li.querySelector('img').dataset.id = r.id;
      li.querySelector('.nm').textContent = (r.nick || '') + (r.id === myId ? ' (나)' : '');
      li.querySelector('.nm').dataset.id = r.nick ? '' : r.id;
      li.querySelector('.sub').textContent = E.TIERS[r.bestTier].name + ' · 월계관 ' + r.laurels + ' · 도감 ' + r.colPct + '%';
      li.querySelector('.val').textContent = S.show(r);
      list.appendChild(li);
    });
    $('rkFoot').textContent = rows.length ? '참가자 ' + rankRows.length + '명. 점수는 각자 기기에서 계산해 올리므로, 친구끼리 보는 순위로 써 주세요.' : (rankErr ? '랭킹을 불러오지 못했다 (' + rankErr + ').' : '아직 아무도 참가하지 않았다. 첫 번째로 이름을 올려 보세요.');
    // 닉네임이 없는 참가자는 claude.ai 프로필 이름과 사진으로 보여 준다(저장하지 않고 볼 때마다 가져온다)
    if (userApi && rows.length) {
      userApi.profiles(rows.map((r) => r.id)).then((ps) => {
        list.querySelectorAll('img[data-id]').forEach((img) => { const p = ps[img.dataset.id]; if (p) img.src = p.avatarUrl; });
        list.querySelectorAll('.nm').forEach((el) => { const id = el.dataset.id; if (id) el.textContent = ((ps[id] && ps[id].name) || '익명 연구자') + (id === myId ? ' (나)' : ''); });
      });
    }
  }
  function renderJoin() {
    const box = $('rkJoin'); if (!box) return;
    if (!myId) { box.innerHTML = '<p class="meta" style="margin:0">로그인한 claude.ai 계정으로 열어야 랭킹에 참가할 수 있습니다. 지금은 순위만 볼 수 있습니다.</p>'; return; }
    if (canWrite === false) { box.innerHTML = '<p class="meta" style="margin:0">이 페이지에서 내 기록을 올리려면 공유한 사람에게 기여자(Contributor) 이상 권한을 받아야 합니다. 지금은 순위만 볼 수 있습니다.</p>'; return; }
    box.innerHTML = '<div class="join"><input id="rkNick" maxlength="12" placeholder="랭킹에 보일 닉네임 (12자까지)" aria-label="랭킹 닉네임"><button class="btn primary center" id="rkGo"><span class="t"></span></button>' +

    $('rkNick').value = st.rank.nick || '';
    const sync = () => {
      $('rkGo').querySelector('.t').textContent = st.rank.join ? '닉네임 저장' : '랭킹 참가하기';
      $('rkLeave').hidden = !st.rank.join;
      $('rkMsg').textContent = writeErr ? '기록을 올리지 못했다 (' + writeErr + '). 이 페이지에 기여자 이상 권한이 있는지 확인해 주세요.' : st.rank.join ? '참가 중. 전직·재입학 때와 1분마다 기록을 올립니다. 진행 저장본은 본인만 볼 수 있게 클라우드에 함께 저장됩니다.' : '참가하면 닉네임과 연구 업적이 이 페이지를 여는 모든 사람에게 보입니다.';
    };
    sync();
    $('rkGo').addEventListener('click', () => { st.rank.nick = $('rkNick').value.trim().slice(0, 12); st.rank.join = true; lastSig = ''; save(); pushScore(true); sync(); setTimeout(sync, 1500); });
    $('rkLeave').addEventListener('click', () => {
      st.rank.join = false; save(); sync();
      db.doc('scores/' + myId).delete().catch(() => {});
    });
  }

  // ---------- 성별 선택 ----------
  function pickGender() {
    queue_front('<h2>어떤 대학원생을 키울까요?</h2><p class="hand">아바타 탭에서 언제든 바꿀 수 있습니다</p><div class="picks"><div>' + charSVG(1, { gender: 'm', top: -1, head: -1, face: -1, posture: -1 }) + '<b>남성</b></div><div>' + charSVG(1, { gender: 'f', top: -1, head: -1, face: -1, posture: -1 }) + '<b>여성</b></div></div>',
      [{ label: '남성으로 시작', primary: true, fn: () => { E.setGender(st, 'm'); save(); update(true); } }, { label: '여성으로 시작', primary: true, fn: () => { E.setGender(st, 'f'); save(); update(true); } }]);

  // ---------- 아바타 (옷장) ----------
  function buildAvatar() {

    h += '<div class="sheet wardrobe"><div>' + charSVG(st.tier) + '</div><div style="display:grid;gap:8px;min-width:0"><div class="gender" role="group" aria-label="성별"><button data-g="m" aria-pressed="' + (st.look.gender === 'm') + '">남성</button><button data-g="f" aria-pressed="' + (st.look.gender === 'f') + '">여성</button></div>' +

  // ---------- 전직 보상 미리보기 ----------
  function showTierPreview(t) {
    const info = E.TIERS[t], reached = st.promotedAt.some((p) => p.tier === t) || st.bestTier >= t;
    const hidden = !reached && t > st.tier + 1 && t >= E.LAST - 1;
    if (hidden) { openModal('<h2>???</h2><p class="hand">아직 알 수 없는 직급</p><p>더 높이 올라가면 조건과 보상이 공개됩니다.</p>', [{ label: '닫기', primary: true }]); return; }
    const li = [];
    const gens = E.GENS.filter((g) => g.tier === t).map((g) => g.name);
    if (gens.length) li.push('새 동료·장비: ' + gens.join(', '));
    const pj = E.PROJECTS.filter((p) => p.tier === t).map((p) => p.kind + '(' + p.grade + ') 「' + p.name + '」');
    if (pj.length) li.push('새 과제: ' + pj.join(', '));
    Object.keys(E.AUTOS).filter((k) => E.AUTOS[k].tier === t).forEach((k) => li.push('자동화: ' + E.AUTOS[k].name + ' — ' + E.AUTOS[k].desc));
    Object.keys(E.SKILLS).filter((k) => E.SKILLS[k].tier === t && t > 1).forEach((k) => li.push('스킬: ' + E.SKILLS[k].name + ' — ' + E.SKILLS[k].desc));
    if (E.SLOTS[t] !== E.SLOTS[t - 1] && t > 1) li.push('과제 슬롯: ' + E.SLOTS[t - 1] + '개 → ' + E.SLOTS[t] + '개');
    if (t === 1) li.push('연차: 석사 1~2년차 (논문 2편째에 2년차, 자동 생산 +10%)');
    if (t === 2) li.push('연차: 박사 1~4년차 (논문 1편마다 1년, 자동 생산 +10%씩)');
    if (t === 3) li.push('탭 1번에 초당 생산의 2%가 더해진다');
    if (t > 1) li.push('자동 생산 ×' + E.CFG.tierProd + ', 탭 ×' + E.CFG.tierTap);
    if (t > 1) li.push(st.bestTier >= t ? '첫 도달 보상 커피 쿠폰 +10 (이미 받음)' : '첫 도달 보상: 커피 쿠폰 +10');
    if (t > 1) li.push('아바타 1개 확정');
    li.push('도감: 「' + info.name + '」 기념사진' + (st.col.photos[t] ? ' (보유)' : ''));
    if (t === E.LAST) li.push('엔딩: 재입학하면 황금 월계관 3개 이상');

    openModal(charSVG(t, { top: -1 }) + '<h2>' + info.name + '</h2><p class="hand">' + info.title + '</p><p class="meta">조건: ' + cond + (t === st.tier ? ' · 지금 직급' : '') + '</p><ul class="preview">' + li.map((x) => '<li>' + x + '</li>').join('') + '</ul>', [{ label: '닫기', primary: true }]);
  }

  const PROMO_LINES = {

  function showPromotion(from) {
    const t = st.tier, info = E.TIERS[t];
    const unlocked = E.GENS.filter((g) => g.tier === t).map((g) => g.name).join(', ');
    openModal('<span class="bigstamp">전직</span>' + charSVG(t) + '<h2>' + info.name + '</h2><p class="hand">' + info.title + '</p><p>' + PROMO_LINES[t] + '</p>' +
      (unlocked ? '<p><b>새로 열림:</b> ' + unlocked + '</p>' : '') + '<p>도감에 「' + info.name + '」 기념사진이 붙었다.</p><p class="num">자동 생산 ×' + E.CFG.tierProd + ', 탭 ×' + E.CFG.tierTap + '</p>', [{ label: '계속 연구한다', primary: true }]);
    say(E.TIERS[from].name + '에서 ' + info.name + '(으)로 전직했다!');
  }
  function showEnding() {
    const lr = E.laurelReward(st);
    openModal('<span class="bigstamp">전설</span>' + charSVG(E.LAST) + '<h2>살아있는 교과서</h2><p class="hand">인류의 지성</p><p>「' + st.paperTitles[st.paperTitles.length - 1] + '」이 교과서 첫 장에 실렸다.</p>' +
      '<div class="stats num"><span>걸린 시간<b>' + mmss(st.time) + '</b></span><span>논문<b>' + st.papers + '편</b></span><span>레벨<b>' + st.lv + '</b></span><span>누적 데이터<b>' + fmt(st.total) + '</b></span></div>' +
      '<p>재입학하면 황금 월계관 <b class="num">' + lr.total + '개</b>를 받습니다 (기본 ' + lr.base + (lr.extra ? ' + 추가 논문 ' + lr.extra : '') + (lr.honor ? ' + 명예 교수 ' + lr.honor : '') + '). 가진 월계관은 1개당 생산·탭 +20%이고, 월계관 탭에서 영구 강화로 바꿀 수 있습니다. 랩실 도감·쿠폰·야옹·구매 내역은 그대로 남습니다.</p>',
      [{ label: '월계관을 받고 재입학', primary: true, fn: () => { st = E.retire(st); refreshDay(); renderedTier = 0; save(); pushScore(true); say('월계관을 쓰고 다시 석사과정에 입학했다. 동기들이 수군거린다.'); update(true); toast('황금 월계관 +' + lr.total + '. 월계관 탭에서 영구 강화를 살 수 있다.'); } },
       { label: '이대로 감상하기' }]);
  }

  // ---------- 지나가는 교수님 ----------
  function spawnProf() {
    if (st.ended || $('lab').querySelector('.prof')) return;
    const b = document.createElement('button');
    b.className = 'prof'; b.innerHTML = '<em aria-hidden="true">🧑‍🏫</em> 교수님';
    b.setAttribute('aria-label', '지나가는 교수님 잡기');
    b.addEventListener('click', (e) => { e.stopPropagation(); const r = E.profReward(st); say(r.text); setMode('think'); b.remove(); update(); });
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('animationend', () => b.remove());
    $('lab').appendChild(b);
  }

  // ---------- 방치 보상 ----------
  function grantOffline(seconds) {
    if (!(seconds > 30)) return;
    const r = E.offline(st, seconds);
    if (r.gain <= 0 && r.levels <= 0) return;
    const lines = ['데이터 <b class="num">+' + fmt(r.gain) + '</b>'];
    if (r.levels) lines.push('레벨 <b class="num">+' + r.levels + '</b> (지금 Lv ' + st.lv + ')');
    if (r.papers) lines.push('후배가 대신 낸 논문 <b class="num">' + r.papers + '편</b>');
    if (r.projects) lines.push('끝난 과제 <b class="num">' + r.projects + '건</b>');
    const capNote = r.capped ? '<p class="meta">' + r.capH + '시간까지만 쌓였다.' + (st.subActive ? '' : ' 정기구독이면 12시간, 효율 100%.') + '</p>' : '';
    const adOk = E.adLeft(st, 'offline') > 0;
    openModal('<h2>다녀오셨어요</h2><p class="hand">자리를 비운 ' + mmss(r.seconds) + ' 동안 (효율 ' + Math.round(r.eff * 100) + '%)</p><p>' + lines.join('<br>') + '</p>' + capNote,
      [{ label: '받기', primary: true }, { label: (st.shop.noAds ? '데이터 2배로 받기' : '광고 보고 데이터 2배') + (adOk ? '' : ' (오늘 광고 소진)'), disabled: !adOk, fn: () => watchAd('offline', r.gain, () => say('방치 보상을 2배로 받았다. 데이터 +' + fmt(r.gain))) }]);
    save();
  }
  function maybeAttend() {
    if (!E.attendReady(st)) return;
    openModal('<h2>출석 ' + st.daily.streak + '일째</h2><p class="hand">오늘도 연구실에 나왔다</p><p>커피 쿠폰 <b class="num">+' + E.attendReward(st) + '</b>' + (E.attendDrink(st) ? ' · 에너지 드링크 <b class="num">+1</b>' : '') + '</p>',
      [{ label: '받기', primary: true, fn: () => { const v = E.claimAttend(st); say('출석 보상: 커피 쿠폰 +' + v); save(); update(); if (tab === 'shop') buildShop(); } }]);
  }

  // ---------- 루프 ----------
  function frame(now) {
    const dt = Math.min(1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    if (!document.hidden && $('modal').hidden) {
      E.tick(st, dt);
      updateFatigue(dt);
      if (st.pet && !st.ended) { petClock += dt; if (petClock >= 1) { petClock = 0; const r = $('lab').getBoundingClientRect(); floatAt(r.width - 50, r.height - 70, '+' + fmt(E.CFG.petTps * E.perTap(st)), 'pet'); } }
      if (st.time >= nextProfAt) { spawnProf(); nextProfAt = st.time + (60 + Math.random() * 60) * (1 - 0.1 * E.upLv(st, 'network')) * (1 - E.colBonus(st).profFreq); }
    }
    requestAnimationFrame(frame);
  }
  setInterval(() => update(), 150);
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); saveCloud(); pushScore(false); return; }
    const away = (Date.now() - hiddenAt) / 1000;
    const day = st.daily.day; refreshDay();
    if (hiddenAt) grantOffline(away);
    if (day !== st.daily.day) maybeAttend();
    lastFrame = performance.now();
  });

  function start(data) {
    const saved = data && data.st ? data : load();
    const restored = saved && E.migrate(saved.st);
    localAt = (saved && saved.at) || 0;
    st = restored || E.newGame();
    refreshDay();
    if (restored) grantOffline((Date.now() - (saved.at || Date.now())) / 1000);
    else pickGender();
    maybeAttend();
    nextProfAt = st.time + 40;
    try { const t = localStorage.getItem(KEY + '.tab'); if (t) { const b = document.querySelector('.tabs button[data-tab="' + t + '"]'); if (b) b.click(); } } catch (e) {}
    update(true);
    requestAnimationFrame(frame);
    initCloud();
  }
  window.claude?.hot?.snapshot?.(() => ({ st, at: Date.now() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
