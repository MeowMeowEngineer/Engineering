<title>랩실 운영하기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 위에 아이소메트릭 캠퍼스 지도(뒤쪽에 대학 본관), 넓은 화면에서는 오른쪽에 탭으로 나뉜 운영 패널. 폰에서는 지도 아래로 쌓는다. */
:root {
  --paper: #eef2f6; --card: #ffffff; --line: #c8d4e0; --ink: #1b2838; --muted: #5a6879;
  --accent: #2346a3; --accent-ink: #ffffff; --stamp: #c3303a; --good: #2b7a4b; --gold: #a86a00; --soft: #e5ecf5; --epic: #8a4fd1;
  --sky: #cfe3f2; --scrim: rgba(10, 16, 28, 0.55);
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Nanum Pen Script", "Apple SD Gothic Neo", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1828; --card: #142238; --line: #2a3f5c; --ink: #e5edf7; --muted: #93a4b9;
  --accent: #8eaeff; --accent-ink: #0e1828; --stamp: #ff6d75; --good: #6fd39a; --gold: #f0b552; --soft: #1b2d48; --epic: #c39bff;
  --sky: #13233a; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0e1828; --card: #142238; --line: #2a3f5c; --ink: #e5edf7; --muted: #93a4b9;
  --accent: #8eaeff; --accent-ink: #0e1828; --stamp: #ff6d75; --good: #6fd39a; --gold: #f0b552; --soft: #1b2d48; --epic: #c39bff;
  --sky: #13233a; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1220px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; }
.brand small { display: block; font-family: var(--font-hand); font-size: 1.3rem; color: var(--muted); }
.topr { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { border: 2px solid var(--ink); background: var(--card); padding: 2px 10px; display: inline-flex; gap: 8px; align-items: baseline; }
.badge b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.badge span { font-family: var(--font-hand); font-size: 1.2rem; color: var(--muted); }
.ticket { border: 2px solid var(--gold); color: var(--gold); background: var(--card); padding: 2px 10px; font-weight: 600; cursor: pointer; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); padding: 8px 12px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.15; }
.stat .s { font-size: 0.78rem; color: var(--muted); }
.bar { height: 7px; background: var(--soft); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 200ms; }

.goal { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 8px 12px; font-size: 0.86rem; }
.goal b { font-family: var(--font-display); font-weight: 400; font-size: 1rem; }
.steps { display: inline-flex; gap: 3px; vertical-align: middle; }
.steps i { width: 18px; height: 8px; border: 1px solid var(--line); background: var(--soft); }
.steps i.on { background: var(--accent); border-color: var(--accent); }
.steps.u i.on { background: var(--gold); border-color: var(--gold); }

.main { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .main { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; } }

/* 지도 */
.mapbox { position: relative; background: linear-gradient(var(--sky), var(--paper)); border: 1px solid var(--line); overflow: hidden; }
.mapscroll { overflow-x: auto; overscroll-behavior-x: contain; }
.map { display: block; width: 100%; height: auto; touch-action: pan-x pan-y; }
@media (max-width: 680px) { .map { width: 680px; max-width: none; } }
.plot { cursor: pointer; }
.plot:focus-visible { outline: none; }
.plot:focus-visible .floor, .plot.sel .floor { stroke: #2346a3; stroke-width: 4; }
.plot:hover .floor { filter: brightness(1.04); }
.plot.sel .uni { filter: drop-shadow(0 0 6px #2346a3); }
.sign rect.bg { fill: #fdfdfb; stroke: #1b2838; stroke-width: 1.5; }
.sign text { font-family: "IBM Plex Sans KR", sans-serif; font-weight: 600; font-size: 13px; fill: #1b2838; }
.sign .timer { fill: #a86a00; font-size: 11px; }
.sign.big rect.bg { fill: #1b2838; } .sign.big text { fill: #ffd54a; font-size: 15px; }
.tag rect { fill: #c3303a; } .tag text { fill: #fff; font-size: 11px; font-weight: 700; font-family: "IBM Plex Sans KR", sans-serif; }
.boost rect { fill: #2b7a4b; }
.led { animation: led 1s steps(2) infinite; } .led.l2 { animation-delay: 0.5s; }
@keyframes led { 50% { opacity: 0.2; } }
.bob { animation: bob 1.6s ease-in-out infinite; }
.bob.b2 { animation-delay: 0.4s; } .bob.b3 { animation-delay: 0.8s; } .bob.b4 { animation-delay: 1.2s; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.glow { animation: glowp 1.8s ease-in-out infinite alternate; }
@keyframes glowp { from { opacity: 0.45; } to { opacity: 1; } }
.crane { animation: crane 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
@keyframes crane { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.coin { animation: coin 1.2s ease-out forwards; }
@keyframes coin { to { transform: translateY(-40px); opacity: 0; } }
.tree { animation: sway 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
@keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
.flag { animation: flag 1.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
@keyframes flag { from { transform: skewY(-6deg); } to { transform: skewY(6deg); } }
.event { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); border: 3px double var(--stamp); background: var(--card); color: var(--stamp); padding: 6px 14px; font-weight: 700; cursor: pointer; animation: pulse 1s ease-in-out infinite; z-index: 2; max-width: calc(100% - 24px); }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
.maptip { position: absolute; left: 10px; bottom: 6px; font-family: var(--font-hand); font-size: 1.15rem; color: var(--muted); pointer-events: none; }

.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 4px; align-items: center; font-size: 0.82rem; }
.flow .st { background: var(--card); border: 1px solid var(--line); padding: 6px 8px; text-align: center; min-width: 0; }
.flow .st b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.flow .st.bott { border: 2px solid var(--stamp); }
.flow .st.bott::after { content: "병목"; display: block; color: var(--stamp); font-weight: 700; font-size: 0.72rem; }
.flow .arrow { color: var(--muted); }

/* 패널 */
.side { display: grid; gap: 10px; min-width: 0; align-content: start; }
.tabs { display: flex; border-bottom: 2px solid var(--ink); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 7px 10px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: 0.92rem; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--stamp); margin-left: 4px; vertical-align: 2px; }
.card { background: var(--card); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card h2, .card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 { font-size: 1.25rem; } .card h3 { font-size: 1.05rem; }
.card h2 small, .card h3 small { font-family: var(--font-body); font-size: 0.82rem; color: var(--muted); }
.note { font-family: var(--font-hand); font-size: 1.2rem; color: var(--muted); line-height: 1.2; margin: 0; }
.meta { font-size: 0.82rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 0.88rem; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn { border: 2px solid var(--ink); background: var(--card); padding: 7px 10px; cursor: pointer; display: grid; gap: 1px; text-align: left; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .t { font-weight: 600; } .btn .s { font-size: 0.76rem; color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary .s { color: inherit; opacity: 0.85; }
.btn.gold { border-color: var(--gold); }
.btn.wide { grid-column: 1 / -1; }
.btn.center { text-align: center; }
.rowi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; border-top: 1px dashed var(--line); padding-top: 6px; }
.rowi .nm { font-weight: 600; font-size: 0.9rem; }
.rowi .btn { min-width: 96px; text-align: right; }
.look { font-weight: 400; color: var(--accent); font-size: 0.82rem; }
.pips { letter-spacing: 1px; color: var(--accent); font-size: 0.8rem; }
.rar { font-size: 0.72rem; font-weight: 700; }
.rar.c { color: var(--muted); } .rar.r { color: var(--accent); } .rar.e { color: var(--epic); } .rar.l { color: var(--gold); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.cardi { border: 1px solid var(--line); padding: 6px 8px; display: grid; gap: 2px; font-size: 0.82rem; background: var(--card); }
.cardi.l { border: 2px solid var(--gold); } .cardi.e { border: 2px solid var(--epic); }
.cardi.missing { background: var(--soft); color: var(--muted); }
.cardi select { border: 1px solid var(--line); background: var(--card); padding: 2px; font-size: 0.8rem; max-width: 100%; }
.ulist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.86rem; }
.ulist li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); padding: 5px 8px; }
.ulist li.cur { border: 2px solid var(--gold); }
.ulist li.done { color: var(--muted); }
.ulist .n { font-family: var(--font-display); text-align: center; }
.stampbtn { border: 3px double var(--stamp); color: var(--stamp); background: var(--card); font-family: var(--font-display); font-size: 1.25rem; padding: 8px; cursor: pointer; animation: pulse2 1.2s ease-in-out infinite; }
@keyframes pulse2 { 50% { transform: scale(1.03); } }
.ticker { font-family: var(--font-hand); font-size: 1.2rem; min-height: 1.5em; }
.students { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; font-size: 0.82rem; max-height: 140px; overflow-y: auto; }
.students li { border: 1px solid var(--line); padding: 3px 8px; }
.students li span { color: var(--muted); font-size: 0.72rem; display: block; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); padding: 6px 10px; font-size: 0.86rem; }
.list li.me { border: 2px solid var(--accent); }
.list .sub { font-size: 0.76rem; color: var(--muted); }
.join { display: flex; gap: 6px; flex-wrap: wrap; }
.join input { font: inherit; padding: 6px 10px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); min-width: 0; flex: 1 1 140px; }

.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--card); border: 2px solid var(--ink); max-width: 420px; width: 100%; max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; display: grid; gap: 12px; text-align: center; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; }
.dialog p { margin: 0; }
.dialog .hand { font-family: var(--font-hand); font-size: 1.4rem; color: var(--muted); }
.bigstamp { justify-self: center; border: 4px double var(--stamp); color: var(--stamp); font-family: var(--font-display); font-size: 1.6rem; padding: 2px 16px; transform: rotate(-8deg); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">랩실 운영하기 <small>교수가 되어 랩실을 운영하라</small></h1>
    <div class="topr">
      <button class="ticket num" id="ticketBtn" aria-label="연구원 모집권, 연구원 탭 열기">🎫 <span id="tickets">0</span></button>
      <div class="badge"><b id="univName">지방 사립대</b><span id="tierName">조교수</span></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><span class="k">연구비</span><span class="v num" id="money">0</span><span class="s num" id="moneyPs">초당 0</span></div>
    <div class="stat"><span class="k">명성</span><span class="v num" id="fame">0</span><div class="bar" aria-hidden="true"><i id="fameBar"></i></div><span class="s num" id="fameNext"></span></div>
    <div class="stat"><span class="k">학생</span><span class="v num" id="studentsN">2</span><span class="s num" id="seatsN"></span></div>
    <div class="stat"><span class="k">연구실 분위기</span><span class="v num" id="mood">100%</span><span class="s" id="moodNote"></span></div>
    <div class="stat"><span class="k">쓴 논문</span><span class="v num" id="papers">0</span><span class="s" id="laurelNote"></span></div>
  </div>
  <div class="goal" id="goal"></div>

  <div class="main">
    <section aria-label="연구실 지도" style="display:grid;gap:8px;min-width:0">
      <div class="mapbox" id="mapbox">
        <div class="mapscroll" id="mapscroll"><svg class="map" id="map" viewBox="-40 -370 880 910" role="img" aria-label="대학 본관과 연구실 아이소메트릭 지도"></svg></div>
        <span class="maptip">본관이나 방을 눌러 업그레이드하세요. 폰에서는 지도를 좌우로 밀어 보세요.</span>
      </div>
      <div class="flow num" id="flow"></div>
      <div class="card"><div class="ticker" id="ticker" aria-live="polite">작은 나라 지방 사립대에 임용된 첫날. 빈 실험실에 학생 둘이 앉아 있다.</div></div>
    </section>

    <aside class="side" aria-label="운영 패널">
      <button class="stampbtn" id="promoteBtn" hidden>승진하기</button>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="room" id="tab-room" aria-selected="true">방</button>
        <button role="tab" data-tab="lab" id="tab-lab" aria-selected="false">학과 연구</button>
        <button role="tab" data-tab="cards" id="tab-cards" aria-selected="false">연구원</button>
        <button role="tab" data-tab="mission" id="tab-mission" aria-selected="false">미션</button>
        <button role="tab" data-tab="ally" id="tab-ally" aria-selected="false">컨소시엄</button>
        <button role="tab" data-tab="rec" id="tab-rec" aria-selected="false">기록</button>
      </nav>
      <div id="panel-room" style="display:grid;gap:10px"><div class="card" id="roomCard"></div><div class="card" id="hireCard"></div></div>
      <div id="panel-lab" class="card" hidden></div>
      <div id="panel-cards" class="card" hidden></div>
      <div id="panel-mission" class="card" hidden></div>
      <div id="panel-ally" style="display:grid;gap:10px" hidden></div>
      <div id="panel-rec" class="card" hidden></div>
    </aside>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

<script src="engine.js"></script>
<script>
(function () {
  const E = window.LabEngine, fmt = E.fmt, fmtTime = E.fmtTime;
  const KEY = 'labtycoon.v1';
  const $ = (id) => document.getElementById(id);
  let st, sel = 'wetlab', tab = 'room', lastFrame = performance.now(), hiddenAt = 0, event = null, nextEventAt = 0, walkClock = 0, endShown = false;
  const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  // ISO 주차 (월요일 시작). 컨소시엄 주간 목표가 이 값으로 바뀐다
  const weekKey = () => { const d = new Date(); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear(); const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7); return y + '-W' + String(w).padStart(2, '0'); };

  // ---------- 아이소메트릭 그리기 ----------
  const W = 120, H = 70, OX = 400, OY = 80, WALL = 44;
  const center = (gx, gy) => [OX + (gx - gy) * W, OY + (gx + gy) * H];
  const P = (cx, cy, u, v, z) => [cx + (u - v) * W * 0.5, cy + (u + v) * H * 0.5 - (z || 0)];
  const pts = (arr) => arr.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  function box(cx, cy, u0, v0, u1, v1, h, top, s1, s2, z0) {
    const z = z0 || 0;
    const t = [P(cx, cy, u0, v0, z + h), P(cx, cy, u1, v0, z + h), P(cx, cy, u1, v1, z + h), P(cx, cy, u0, v1, z + h)];
    const fr = [P(cx, cy, u1, v0, z), P(cx, cy, u1, v1, z), P(cx, cy, u1, v1, z + h), P(cx, cy, u1, v0, z + h)];
    const fl = [P(cx, cy, u0, v1, z), P(cx, cy, u1, v1, z), P(cx, cy, u1, v1, z + h), P(cx, cy, u0, v1, z + h)];
    const sh = [P(cx, cy, u0 + 0.06, v0 + 0.06), P(cx, cy, u1 + 0.1, v0 + 0.06), P(cx, cy, u1 + 0.1, v1 + 0.1), P(cx, cy, u0 + 0.06, v1 + 0.1)];
    return (z ? '' : '<polygon points="' + pts(sh) + '" fill="#00000018"/>') + '<polygon points="' + pts(fl) + '" fill="' + s2 + '"/><polygon points="' + pts(fr) + '" fill="' + s1 + '"/><polygon points="' + pts(t) + '" fill="' + top + '" stroke="#00000018" stroke-width="0.8"/>';
  }

  let db = null, userApi = null, myId = null, canWrite = null, members = {}, alliances = {}, pushing = false, lastPushSig = '', lastPushAt = 0, writeErr = '';
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

  function cleanMember(id, d) {
    const donated = {}; Object.keys(E.ALLY_TECH).forEach((k) => { donated[k] = Math.max(0, Math.min(1e6, num((d.donated || {})[k], 0))); });
    const helps = {}; if (d.helps && typeof d.helps === 'object') Object.keys(d.helps).slice(0, 50).forEach((k) => { if (typeof d.helps[k] === 'string') helps[k] = d.helps[k].slice(0, 40); });
    const reqs = Array.isArray(d.reqs) ? d.reqs.slice(0, 4).map((r) => ({ reqId: str(r && r.reqId, 20), label: str(r && r.label, 40), left: num(r && r.left, 0), at: num(r && r.at, 0) })) : [];
    return { id, nick: str(d.nick, 12), ally: str(d.ally, 80) || null, tier: Math.min(5, Math.max(1, num(d.tier, 1) | 0)), univ: Math.min(5, Math.max(1, num(d.univ, 1) | 0)), power: Math.max(0, num(d.power, 0)), donated, weekKey: str(d.weekKey, 10), weekPapers: Math.max(0, num(d.weekPapers, 0)), helpGiven: num(d.helpGiven, 0), helps, reqs, at: num(d.updatedAt, 0) };

  const team = () => (st.ally.id ? Object.values(members).filter((m) => m.ally === st.ally.id) : []);
  function syncAlly() {
    if (!st.ally.id) { st.allyTech = {}; return; }

    const sums = {}; Object.keys(E.ALLY_TECH).forEach((k) => { sums[k] = st.ally.donated[k] || 0; });
    team().forEach((m) => { if (m.id !== myId) Object.keys(sums).forEach((k) => { sums[k] += m.donated[k]; }); });

    // 나에게 온 도움 반영
    const counts = {};
    team().forEach((m) => { if (m.id === myId) return; const h = m.helps[myId]; if (!h) return; const [rid, n] = h.split(':'); counts[rid] = (counts[rid] || 0) + (Number(n) || 0); });
    Object.keys(counts).forEach((rid) => { const cut = E.applyHelps(st, rid, counts[rid]); if (cut > 0) say('컨소시엄 동료들이 도와줘서 ' + fmtTime(cut) + ' 빨라졌다.'); });
  }
  async function initCloud() {
    const C = window.claude;

    if (!db) { if (tab === 'ally') renderAlly(); return; }
    myId = userApi ? await userApi.id() : null;
    canWrite = userApi ? await userApi.can('data.write') : null;
    db.collection('members').onSnapshot((snap) => { members = {}; snap.docs.forEach((d) => { if (d.exists) members[d.id] = cleanMember(d.id, d.data() || {}); }); syncAlly(); if (tab === 'ally') renderAlly(); }, () => { if (tab === 'ally') renderAlly(); });
    db.collection('alliances').onSnapshot((snap) => { alliances = {}; snap.docs.forEach((d) => { if (d.exists) { const x = d.data() || {}; alliances[d.id] = { id: d.id, name: str(x.name, 20) || '이름 없는 컨소시엄' }; } }); if (tab === 'ally') renderAlly(); }, () => {});

  }

  // ---------- 화면 갱신 ----------
  function switchTab(t) {

    tabSig = ''; roomSig = '';
    renderTab(true);
  }

    if (tab === 'room') {
      const rs = sel === 'univ' ? 'u' + st.univ + E.canUpgradeUniv(st) + (E.building(st, 'univ') ? Math.ceil(E.building(st, 'univ').endAt - st.time) : '') + st.tier :
        sel + E.lv(st, sel) + E.canUpgrade(st, sel) + Math.ceil((st.cooldown[sel] || 0) - st.time) + st.univ + JSON.stringify(st.equip[sel]) + E.EQUIP[sel].map((_, i) => E.canEquip(st, sel, i)).join() + (E.building(st, sel) ? Math.ceil(E.building(st, sel).endAt - st.time) : '') + st.cards.assign[sel] + Math.ceil((st.cards.skillCd[st.cards.assign[sel]] || 0) - st.time);

    if (tab === 'lab') renderLab();

  }

  function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function grantOffline(sec) {
    if (!(sec > 30)) return;
    const r = E.offline(st, sec);
    if (r.money <= 0) return;
    openModal('<h2>다녀오셨어요</h2><p class="hand">자리를 비운 ' + fmtTime(r.seconds) + ' 동안 (효율 50%)</p><p>학생들이 연구비 <b class="num">+' + fmt(r.money) + '</b>, 명성 <b class="num">+' + fmt(r.fame) + '</b>을 모았다. 공사·연구 타이머도 그만큼 흘렀다.</p>' + (r.capped ? '<p class="meta">연구비·명성은 최대 8시간까지만 쌓인다.</p>' : ''), [{ label: '좋아', primary: true }]);
    save();
  }

  // ---------- 루프 ----------
  function frame(now) {
    const dt = Math.min(1, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
    if (!document.hidden && $('modal').hidden) { E.tick(st, dt); stepWalkers(dt); checkEvent(); }
    requestAnimationFrame(frame);
  }
  setInterval(() => { E.refreshDay(st, dayKey()); E.refreshWeek(st, weekKey()); refresh(false); }, 250);
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); pushMe(true); return; }
    if (hiddenAt) grantOffline((Date.now() - hiddenAt) / 1000);
    lastFrame = performance.now();
  });
  function start(data) {
    const saved = data && data.st ? data : load();
    const restored = saved && E.migrate(saved.st);
    st = restored || E.newGame();
    E.refreshDay(st, dayKey()); E.refreshWeek(st, weekKey());
    if (restored) grantOffline((Date.now() - (saved.at || Date.now())) / 1000);
    endShown = !!st.ended; // 이미 끝난 저장은 버튼으로만 엔딩을 다시 연다
    nextEventAt = st.time + 60;
    refresh(true);
    const sc = $('mapscroll'); sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2;
    requestAnimationFrame(frame);
    initCloud();
  }
  window.claude?.hot?.snapshot?.(() => ({ st, at: Date.now() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
