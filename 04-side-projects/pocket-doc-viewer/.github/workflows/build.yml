name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (mobile viewport)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173/
          node scripts/screenshots.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk pocket-doc-viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-doc-viewer-apk
          path: pocket-doc-viewer.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: 포켓 문서 뷰어 v${{ env.VERSION }}
          make_latest: true
          files: pocket-doc-viewer.apk
          body: |
            휴대폰에서 이 페이지를 열고 아래 **pocket-doc-viewer.apk**를 눌러 설치하세요.
            처음 한 번은 '출처를 알 수 없는 앱 설치'를 허용해야 합니다.

            웹에서 바로 쓰기: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
